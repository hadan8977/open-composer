# Preregistered candidate manifest for the giants sweep (iteration giants_sweep_20260922).
#
# Built from the "汇总" table of reports/research/intel/I-20260922-03-giants-census.md.
# Families F1, F2, F4, F5, F6, F7 are in scope. F3 is skipped (H-20260922-04 already
# ran that family and it was refuted); the VIX term-structure family is skipped as
# unrunnable (no VX futures on this box) -- both are recorded in unrunnable.md.
#
# The census table sketched ~156 grid points. `oc research iteration validate` caps an
# uncampaigned iteration at 24 preregistered candidates, so every *searched* dimension
# (threshold sweeps, extra rebalance variants) was dropped and only values that the
# cited primary source actually publishes were kept, plus one explicitly labelled
# ablation or leverage variant per family. This is a narrowing, never a widening: no
# window, cost, placebo or gate threshold from the brief was relaxed. See
# reports/research/iterations/giants_sweep_20260922/search-space.md.
#
# Protocol (frozen, identical to H-20260918-05 / H-20260922-02 / H-20260922-04):
#   warmup  2022-06-01 .. 2023-09-15   (lookbacks only, never scored)
#   select  2023-09-18 .. 2025-12-31   (the only window used for ranking)
#   holdout 2026-01-02 .. 2026-09-17   (untouched out-of-sample)
#   anchor  2024-01-08 .. 2026-09-16   (the window the SPMO benchmark quotes)
#   costs   sum(|delta w|) * bps on the execution session, 10 bp primary / 20 bp stress
#   fills   signal on the close, filled at the next session's open
schema_version: 1
iter_id: giants_sweep_20260922
generated_before_backtest: true
cash_asset: SHY
risk_free_asset: BIL
benchmarks: [SPY, MTUM, SPMO, QQQ, TQQQ]
costs_bp: [10, 20]
placebo_seeds:
  random_pick: 60
  random_weights: 60
  calendar_shift: 20

candidates:


# 2026-10-07: a run hung for 2 h (oneshot without timeout), which also stopped the timer.
# Background agents (rounds, children) are archived after 2 h idle, top-level after 24 h.
[Service]
TimeoutStartSec=20min
ExecStart=
ExecStart=/usr/bin/python3 /root/.paseo/bin/paseo_memory_maintenance.py --idle-hours 24 --background-idle-hours 2 --archived-process-grace-minutes 10

# 2026-10-08 01:53 UTC the box ran out of swap, the kernel OOM-killed one Chrome helper of
# the Paseo daemon, and systemd's default OOMPolicy=stop then stopped the whole daemon:
# every Paseo session ended at once (the owner's other projects too). With continue,
# an OOM kill takes only that one process; the daemon and the other sessions keep running.
[Service]
OOMPolicy=continue

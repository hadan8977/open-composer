name: s2_rebalance_timing_h20260928_23
description: 'Preregistered T-20260928-01 candidate family. S2 (A3_growth menu SPMO/QQQ/SMH/XLK/GLD/TLT,
  blended 21/63/126/252-session momentum, top 2, SHY absolute-momentum filter, renewal down-only vol
  target 0.156) run with its monthly signal close moved 0..20 sessions after month end (O00..O20,
  O00 = live rule, descriptive distribution only). Measures S2''s own rebalance-date luck, the same
  question H-20260928-01 asked and answered for S3. No offset is adopted; the live rule is unchanged.
  Research only, deterministic, next-session execution; no broker writes.'
timeframe: daily
universe:
- BIL
- GLD
- QQQ
- SHY
- SMH
- SPMO
- TLT
- XLK
lifecycle: draft
position_direction: long_only
entry:
  all:
  - close > 0
  any: []
exit:
  all: []
  any:
  - close <= 0
risk:
  max_trades_per_day: 3
  max_position_weight: 1.0
  stop_loss_pct: null
  take_profit_pct: null
portfolio:
  mode: hybrid_adaptive_router
  max_symbols_per_day: 3
  gross_exposure_limit: 1.0
  max_symbol_weight: 1.0
  same_day_flatten: false
  duplicate_signal_policy: stable_signal_id
  selected_route_label: h20260928_23:s2_rebalance_timing
costs:
  commission_pct: 0.0
  slippage_bps: 10.0
  impact_model: linear
  impact_eta: 0.0
  impact_gamma: 0.0
execution:
  backend: nautilus_trader
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none
data:
  source: alpaca
  symbol: SPMO
  path: data/sip/daily
  feed: sip
data_assumptions:
  source: alpaca
  adjusted: true
  timezone: America/New_York
  acquisition_tier: research_strict
  session_scope: regular
  forward_fill_allowed: false
  zero_return_substitution_allowed: false
  nonfinite_action: fail_closed
  historical_quality_paper_eligible: false
  historical_quality_is_paper_authorization: false
factors:
  s2_offset_momentum_pick:
    source: expression
    expression: close / lag(close, 63) - 1
    default: 0.0
    description: Documentation-only stand-in. The actual picks and vt15.6 exposure are produced by
      scripts/run_h20260922_05_salvage.py (sleeve s2, target 0.156) unchanged, with the monthly signal
      session moved o sessions after month end by scripts/run_h20260928_23_s1_s2_rebalance_timing.py;
      O00 is asserted equal to salvage.run_cell.
    params:
      decision_lag_sessions: 1
llm_review:
  enabled: false
  model: null
required_capabilities:
- market.alpaca_bars
research_design:
  iter_id: h20260928_23_s1_s2_rebalance_timing
  candidate_manifest_path: reports/research/iterations/h20260928_23_s1_s2_rebalance_timing/candidate-manifest.json

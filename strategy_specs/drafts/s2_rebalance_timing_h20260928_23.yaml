  candidate_budget: 21
  selection_objective: No selection among offsets. Purely descriptive timing-luck distribution for S2;
    no offset can be adopted from this run, and the live month-end rule (vol target 0.156) is unchanged.
  anti_overfit_notes:
  - All 21 candidates frozen before any return is computed; S2's live rule inherited unchanged from
    scripts/run_h20260922_05_salvage.py and the 2026-09-23 renewal vol target.
  - No offset may be adopted from this run, so the best-offset result cannot be cherry-picked.
  - G3 placebo not applicable (no pick or gate changes); the 21-offset distribution is the luck reference,

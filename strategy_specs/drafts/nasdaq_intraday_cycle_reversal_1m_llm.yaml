name: nasdaq_intraday_cycle_reversal_1m_llm
description: LLM-assisted NASDAQ intraday cycle-reversal rotation using prompt-visible training and validation evidence only.
timeframe: 1m
universe:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - META
  - GOOGL
  - AVGO
  - AMD
  - QCOM
  - AMAT
  - NFLX
  - TSLA
lifecycle: draft

entry:
  all:
    - "close < ema(close, 8)"
    - "rsi(close, 3) < 45"
    - "volume > sma(volume, 4)"

exit:
  any:
    - "close > ema(close, 8)"
    - "rsi(close, 3) > 55"

risk:
  max_trades_per_day: 1
  max_position_weight: 0.15
  stop_loss_pct: 0.9
  take_profit_pct: 1.4

costs:
  commission_pct: 0.005
  slippage_bps: 2.0

execution:
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none

data:
  source: alpaca
  symbol: AAPL
  feed: iex

data_assumptions:
  source: alpaca
  adjusted: true
  timezone: America/New_York

llm_review:
  enabled: true
  model: gpt-5.5

required_capabilities:
  - market.alpaca_bars

notes:
  intent: Let the LLM choose among prompt-visible cycle-reversal candidates without final OOS metrics.
  research_design:
    data_timeframe: 1m
    signal_timeframe: 1m
    rebalance_frequency: daily
    llm_review_frequency: pre_selection_only
    method_variants:
      - opening_reversal
      - prior_negative_market_cycle
      - same_day_flatten
    factor_variants:
      - qqq_prior_momentum_gate
      - opening_return_dislocation
      - relative_opening_volume
    parameter_ranges:
      lookback_days: [5, 10]
      entry_after_bars: [5]
      top_n: [1, 2]
      max_opening_return_pct: [-0.2]
      min_relative_volume: [0.8]
      market_gate: [qqq_prior_negative]
    candidate_cap: 8
    objective: equal_weight_intraday_alpha_after_costs
  open_questions:
    - Treat LLM selection as advisory until it adds repeatable marginal lift on blind windows.
    - Add replayable LLM feature packets before treating LLM output as independent alpha.

name: memory_storage_momentum_15m_stx_alpaca_1h_trend_hold
description: 'Intraday MU momentum strategy for the memory/storage AI data-center
  theme. Horizon candidate: 1h_trend_hold.'
timeframe: 1h
universe:
- MU
- SNDK
- WDC
- STX
lifecycle: draft
entry:
  all:
  - close > ema(close, 8)
  - ema(close, 5) > ema(close, 13)
  - ema(close, 13) > ema(close, 21)
  - rsi(close, 14) > 54
  - volume > sma(volume, 8)
  any: []
exit:
  all: []
  any:
  - close < ema(close, 21)
  - rsi(close, 14) > 98
risk:
  max_trades_per_day: 1
  max_position_weight: 0.2
  stop_loss_pct: 3.0
  take_profit_pct: 12.0
execution:
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none
data:
  source: alpaca
  symbol: STX
  path: null
  feed: iex
data_assumptions:
  source: alpaca
  adjusted: true
  timezone: America/New_York
llm_review:
  enabled: true
  model: gpt-5.5
notes:
  intent: Trade intraday continuation in memory/storage names when MU leads on price,
    volume, and AI data-center context. Real trading remains manual.
  open_questions:
  - Confirm live Alpaca IEX coverage versus paid SIP before production use.
  - Measure whether MU, WDC, or STX provides the cleanest intraday proxy.
  - Keep news/event context as a filter and review input, not a sole entry rule.
  horizon_profile: lower_frequency_trend
  horizon_thesis: Tests whether options-friendly trend duration matters more than
    scan speed.
  horizon_optimization: Selected from 5m higher-frequency, 15m lower-turnover, and
    1h trend-hold candidates.
required_capabilities:
- market.alpaca_bars
- events.sec_filings
- macro.fred_series
- news.alpha_vantage
- news.gdelt

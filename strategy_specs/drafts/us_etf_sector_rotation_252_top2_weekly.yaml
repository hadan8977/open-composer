name: us_etf_sector_rotation_252_top2_weekly
description: >-
  S1 of card H-20260918-05: weekly relative-strength rotation across the 11 SPDR sector ETFs, 252-session lookback, top 2 equal weight, absolute-momentum filter against SHY. Recent-window evidence (net 10 bp per side, next-open fills): selection 2023-09-18..2025-12-31 Sharpe 1.14, untouched holdout 2026-01-02..2026-09-17 Sharpe 2.22 / 46.4% annualized, 2024-01-08..2026-09-16 Sharpe 1.36 / 27.8% annualized / -16.9% max drawdown versus SPMO 1.28 / 35.8% / -20.3%. A 60-seed random-pick placebo over the same menu and calendar reaches this holdout Sharpe in only 2% of seeds, so the ranking itself carries the evidence here. Below contract: multi-year robustness was deliberately not required. RENEWAL 2026-09-23 (owner approved): selection rule unchanged (card H-20260922-05 measured the volatility target as a return tax here); a 12% sleeve drawdown exit liquidates the sleeve and revokes its paper authorization.
timeframe: daily
universe: [XLK, XLV, XLF, XLE, XLI, XLY, XLP, XLU, XLB, XLRE, XLC, SHY]
lifecycle: draft
position_direction: long_only
entry:
  # Unused: target weights come from
  # open_composer.adapters.execution.rotation_target_weights, not from rule
  # evaluation. Always-true placeholder to satisfy the StrategySpec schema,
  # same convention as strategy_specs/drafts/us_recent_high_return_top50.yaml.
  all: [close > 0]
  any: []
exit:
  all: []
  any: [close <= 0]
risk:
  # 2026-09-18: a rotation sleeve holds at most top_n names and, when the
  # absolute-momentum filter drops a pick, unfilled_slot_policy
  # =renormalize_survivors can put 100% of the sleeve in a single ETF (the
  # levered sleeve does exactly that today). The real exposure bound is the
  # sleeve's own notional_budget_usd of 15000 against a 103k account, not a
  # per-name weight cap, so the weight caps are set to 1.0 rather than
  # silently clamping the strategy's own rule. A 5% cap would have sized
  # today's levered book at 4 shares instead of 99.
  max_trades_per_day: 10
  max_position_weight: 1.0
  stop_loss_pct: null
  take_profit_pct: null
portfolio:
  mode: etf_rotation_portfolio
  weighting: equal_weight
  gross_exposure_limit: 1.0
  max_symbol_weight: 1.0
  duplicate_signal_policy: stable_signal_id
  etf_rotation:
    menu: [XLK, XLV, XLF, XLE, XLI, XLY, XLP, XLU, XLB, XLRE, XLC]
    cash_symbol: SHY
    lookbacks: [252]
    top_n: 2
    rebalance: weekly_friday
    absolute_momentum_filter: true
    # The preregistered grid on card H-20260918-05 equal-weighted the
    # survivors among themselves whenever the absolute-momentum filter dropped
    # a pick, so a two-slot book with one survivor was 100% in that survivor.
    # Shipping the more defensive per-slot-cash rule instead would ship a
    # strategy that was never tested. Measured difference (card section 12):
    # the sector sleeve never fires the filter in 225 rebalances and the growth
    # sleeve fires once in 52, so both are unaffected; the levered sleeve fires
    # it in 13 of 52 months and its anchor-window Sharpe is 1.48 here against
    # 1.26 under the cash rule. Known risk, stated in the card: this
    # concentrates exactly when the filter is warning.
    unfilled_slot_policy: renormalize_survivors
    min_history_sessions: 260
    # 2026-09-18: three rotation sleeves share one $103k Alpaca paper account
    # that already runs us_recent_high_return_top50 at ~100% of equity. Each
    # sleeve is therefore sized against its own $15k budget, not account
    # equity, and each is tracked as an independent forward record rather than
    # as part of one account-level portfolio.
    notional_budget_usd: 15000.0
    # 2026-09-23 renewal: rule unchanged; the sleeve compounds its own P&L
    # and exits on a 12% drawdown from its equity peak.
    sizing_basis: sleeve_equity
    drawdown_exit_pct: 0.12
costs:
  commission_pct: 0.0
  slippage_bps: 10.0
  impact_model: linear
  impact_eta: 0.0
  impact_gamma: 0.0
execution:
  backend: python_reference
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none
execution_policy:
  policy_id: etf_rotation_day_market_open_queue_v1
  # 2026-09-18: four strategies now share one Alpaca paper account. The
  # rehearsal planner's default scope sells every account position that is not
  # in the current strategy's targets, so without this key the first strategy to
  # run each night would liquidate the other three. strategy_ledger makes the
  # planner reconcile against this strategy's own recorded fills
  # (reports/paper/rehearsal/<name>-fills.jsonl) and ignore positions it did not
  # open. Required here because the sleeves overlap on symbols (XLK is in two
  # menus), so scoping by symbol would not be enough.
  position_scope: strategy_ledger
  order_style: day_market
  time_in_force: day
  naked_market_justification: >-
    Paper rehearsal only, and the book is two to three high-liquidity ETFs.
    Opening-auction (opg) orders expired unfilled for 45 of 50 names at the
    2026-09-15 Alpaca Paper open, so this path uses a day market order queued
    after the close, which executes at the 09:30 open. TCA records the
    submitted price, the official open and the fill so the cost of the market
    order is measured rather than assumed.
  price_protection: {limit_offset_bps: 20.0, max_open_gap_pct: 3.0, max_spread_bps: 10.0}
  participation_cap: {max_adv_pct: 0.1, max_open_bar_volume_pct: 1.0}
  fallback_behavior: {if_not_filled: skip, if_gap_exceeds_limit: skip, if_spread_exceeds_limit: skip}
  tca:
    enabled: true
    compare_to: [decision_price, official_open, arrival_price, vwap]
    record_submitted_at: true
    record_fill_price: true
    review_frequency: weekly
  alternatives_compared: [moo_market, opg_limit]
  source_card_ids: []
reality_model:
  fill_model: next_regular_open_with_policy
  slippage_model: stress_bps_by_volatility_and_participation
  stress_scenarios:
    - {name: primary, slippage_bps: 10.0, open_gap_pct: 0.5}
    - {name: stress, slippage_bps: 20.0, open_gap_pct: 1.5}
    - {name: severe_report_only, slippage_bps: 35.0, open_gap_pct: 2.5}
data:
  source: alpaca
  symbol: null
  path: null
  feed: sip
data_assumptions:
  source: alpaca
  adjusted: true
  timezone: America/New_York
llm_review: {enabled: false}
required_capabilities: [market.alpaca_bars]
notes:
  intent: >-
    Forward paper record for the only cell in the H-20260918-05 grid whose ranking beat its random-pick placebo decisively (2% of 60 seeds). Lowest return and lowest drawdown of the three sleeves.
  candidate_id: h20260918_05_us_etf_sector_rotation_252_top2_weekly
  candidate_role: recent_window_rotation_sleeve_on_paper
  promotion_eligible: false
  order_authority: false
  broker_writes: rehearsal_only
  shadow_only: false
  observation_only: false
  paper_rehearsal:
    status: below_contract
    started: 2026-09-18
    plan: reports/research/hypotheses/H-20260918-05-recent-window-etf-menu.md
    gate_v2: not_evaluated
    purpose: forward_evidence_on_recent_window_rotation_cells

name: us_multiasset_forward_mm_r5_c01
description: Preregistered LightGBM ETF ranker combining core and frozen LLM-derived formula factors for R5.
timeframe: daily
universe: [BIL, GLD, IEF, QQQ, SPY, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY]
lifecycle: draft
position_direction: long_only
entry: {all: [close > 0], any: []}
exit: {all: [], any: [close <= 0]}
risk: {max_trades_per_day: 6, max_position_weight: 0.34, stop_loss_pct: null, take_profit_pct: null}
portfolio:
  mode: cross_sectional_momentum
  cross_sectional_execution_profile: monthly_equal_weight_bil_reserve
  max_symbols_per_day: 3
  gross_exposure_limit: 1.0
  max_symbol_weight: 0.34
  same_day_flatten: false
  duplicate_signal_policy: stable_signal_id
  selected_route_label: mm_r5:C01:lgbm_core_llm_top3
  position_weight_enforcement: entry_only
  rebalance_schedule: calendar_month_end
  weighting: equal_weight
  reserve_symbol: BIL
  reserve_exempt_from_max_symbol_weight: true
costs: {commission_pct: 0.0, slippage_bps: 10.0, impact_model: linear, impact_eta: 0.0, impact_gamma: 0.0}
execution: {backend: python_reference, mode: manual_signal, signal_on: bar_close, fill_assumption: next_bar_open, broker: none}
execution_policy:
  policy_id: multiasset_mm_r5_opg_limit_v1
  order_style: opg_limit
  time_in_force: opg
  price_protection: {limit_offset_bps: 20.0, max_open_gap_pct: 2.5, max_spread_bps: 15.0}
  participation_cap: {max_adv_pct: 0.01, max_open_bar_volume_pct: 0.1}
  fallback_behavior: {if_not_filled: skip, if_gap_exceeds_limit: skip, if_spread_exceeds_limit: skip}
  tca: {enabled: true, compare_to: [decision_price, official_open, arrival_price, vwap], record_submitted_at: true, record_fill_price: true, review_frequency: weekly}
  alternatives_compared: [moo_market, opg_limit, delayed_open_30m_shadow]
  source_card_ids: [r9_alpaca_opg_semantics, r9_alpaca_paper_limitations]
reality_model:
  fill_model: next_regular_open_with_policy
  slippage_model: stress_bps_by_volatility_and_participation
  stress_scenarios:
    - {name: primary, slippage_bps: 10.0, open_gap_pct: 0.5}
    - {name: stress, slippage_bps: 20.0, open_gap_pct: 1.5}
    - {name: severe_report_only, slippage_bps: 35.0, open_gap_pct: 2.5}
data: {source: alpaca, symbol: SPY, path: data/research/alpaca_etf_structural_r9, feed: sip}
data_assumptions:
  source: alpaca
  adjusted: true
  timezone: America/New_York
  acquisition_tier: research_strict
  immutable_snapshot_required: true
  snapshot_manifest_path: data/research/alpaca_etf_structural_r9/snapshot-manifest.json
  adjustment: all
  session_scope: regular
  forward_fill_allowed: false
  zero_return_substitution_allowed: false
  nonfinite_action: fail_closed
factors:
  mom_21: {source: expression, expression: "close / lag(close, 21) - 1", default: 0.0, description: One-month return.}
  mom_63: {source: expression, expression: "close / lag(close, 63) - 1", default: 0.0, description: Three-month return.}
  mom_126_skip21: {source: expression, expression: "lag(close, 21) / lag(close, 126) - 1", default: 0.0, description: Six-to-one momentum.}
  mom_252_skip21: {source: expression, expression: "lag(close, 21) / lag(close, 252) - 1", default: 0.0, description: Twelve-to-one momentum.}
  trend_gap_126: {source: expression, expression: "close / sma(close, 126) - 1", default: 0.0, description: Medium-trend distance.}
  vol_21: {source: expression, expression: "stddev(close / lag(close, 1) - 1, 21)", default: 0.0, description: One-month realized volatility.}
  drawdown_63: {source: expression, expression: "close / highest(close, 63) - 1", default: 0.0, description: Drawdown from the 63-session high.}
  high_gap_252: {source: expression, expression: "close / highest(close, 252) - 1", default: 0.0, description: Distance from the 252-session high.}
  vol_63: {source: expression, expression: "stddev(close / lag(close, 1) - 1, 63)", default: 0.0, description: Three-month realized volatility.}
  volume_surprise_21: {source: expression, expression: "volume / sma(volume, 21) - 1", default: 0.0, description: Volume relative to its 21-session mean.}
  ma_gap_50: {source: expression, expression: "close / sma(close, 50) - 1", default: 0.0, description: Price distance from its 50-session mean.}
  volume_surprise_5: {source: expression, expression: "volume / sma(volume, 5) - 1", default: 0.0, description: Volume relative to its five-session mean.}
  high_gap_63: {source: expression, expression: "close / highest(close, 63) - 1", default: 0.0, description: Distance from the 63-session high.}
  llm_momentum_quality: {source: expression, expression: "mom_126_skip21 + high_gap_252 - vol_63", default: 0.0, description: Frozen R2 LLM-derived momentum-quality formula after matched cross-sectional ranks., params: {transform: weighted_sum_of_component_cross_sectional_percentile_ranks, rank_method: percentile_rank_by_decision_session, full_sample_fit: false, components: [mom_126_skip21, high_gap_252, vol_63], coefficients: [1.0, 1.0, -1.0], population: rankable_symbols_with_finite_history, rank_ascending: true, tie_break: symbol_ascending, apply_at: decision_close}}
  llm_volume_confirmed_trend: {source: expression, expression: "mom_63 + volume_surprise_21 + ma_gap_50", default: 0.0, description: Frozen R2 LLM-derived volume-confirmed-trend formula after matched cross-sectional ranks., params: {transform: weighted_sum_of_component_cross_sectional_percentile_ranks, rank_method: percentile_rank_by_decision_session, full_sample_fit: false, components: [mom_63, volume_surprise_21, ma_gap_50], coefficients: [1.0, 1.0, 1.0], population: rankable_symbols_with_finite_history, rank_ascending: true, tie_break: symbol_ascending, apply_at: decision_close}}
  llm_rebound_trap: {source: expression, expression: "mom_21 - mom_126_skip21 - drawdown_63", default: 0.0, description: Frozen R2 LLM-derived rebound-trap formula after matched cross-sectional ranks., params: {transform: weighted_sum_of_component_cross_sectional_percentile_ranks, rank_method: percentile_rank_by_decision_session, full_sample_fit: false, components: [mom_21, mom_126_skip21, drawdown_63], coefficients: [1.0, -1.0, -1.0], population: rankable_symbols_with_finite_history, rank_ascending: true, tie_break: symbol_ascending, apply_at: decision_close}}
  llm_crowding_risk: {source: expression, expression: "mom_21 + volume_surprise_5 + high_gap_63 - mom_252_skip21", default: 0.0, description: Frozen R2 LLM-derived crowding-risk formula after matched cross-sectional ranks., params: {transform: weighted_sum_of_component_cross_sectional_percentile_ranks, rank_method: percentile_rank_by_decision_session, full_sample_fit: false, components: [mom_21, volume_surprise_5, high_gap_63, mom_252_skip21], coefficients: [1.0, 1.0, 1.0, -1.0], population: rankable_symbols_with_finite_history, rank_ascending: true, tie_break: symbol_ascending, apply_at: decision_close}}
model:
  kind: lightgbm_regressor
  label: {type: forward_return, horizon_bars: 21}
  features: [mom_21, mom_63, mom_126_skip21, mom_252_skip21, trend_gap_126, vol_21, drawdown_63, llm_momentum_quality, llm_volume_confirmed_trend, llm_rebound_trap, llm_crowding_risk]
  training: {window_bars: 756, retrain_every_bars: 21, test_window_bars: 63, embargo_bars: 21, seed: 4101}
  selection: {method: top_quantile, quantile: 0.22}
  hyperparameters: {n_estimators: 120, num_leaves: 7, learning_rate: 0.03, min_child_samples: 40, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, reg_lambda: 2.0, verbosity: -1, n_jobs: 1}
  baseline: linear_composite
llm_review: {enabled: false}
required_capabilities: [market.alpaca_bars]
research_design:
  iter_id: mom_multiasset_forward_multimodal_r5
  candidate_manifest_path: reports/research/iterations/mom_multiasset_forward_multimodal_r5/candidate-manifest.json
  data_feasibility_path: reports/research/iterations/mom_multiasset_forward_multimodal_r5/data-feasibility.json
  data_contract_path: reports/research/iterations/mom_multiasset_forward_multimodal_r5/data-contract.json
  holdout_contract_path: reports/research/iterations/mom_multiasset_forward_multimodal_r5/holdout-contract.json
  cost_contract_path: reports/research/iterations/mom_multiasset_forward_multimodal_r5/cost-contract.json
  cumulative_trial_contract_path: reports/research/iterations/mom_multiasset_forward_multimodal_r5/cumulative-trial-contract.json
  source_cards_path: reports/harness/source_cards/us_multiasset_forward_multimodal_r5.jsonl
  preregistration_lock_path: reports/research/iterations/mom_multiasset_forward_multimodal_r5/lock-set/preregistration-lock.json
  parameter_space: {candidate_id: [R5C01], parameter_search: [false]}
  candidate_budget: 8
  selection_objective: Test incremental lift from frozen LLM-derived formulas in a matched trained ranker.
  anti_overfit_notes: [Same model family and training contract as M01, No formula search after results, Exact fallback to M01 then D01, Any pass means only historical contribution from frozen formula mappings and never independent LLM Alpha]
  validation_plan: [four_chronological_folds, eight_chronological_pbo_blocks, minimum_20_valid_cscv_partitions, matched_feature_ablation, paired_transfer_moving_block_bootstrap, placebo, twenty_forward_sessions, matched_paper_tca]
notes:
  candidate_id: R5C01
  candidate_role: combined_ml_and_llm_formula
  method: fold_local_lightgbm_core_plus_llm_formulas
  fallback_candidate_id: R5M01_then_R5D01
  llm_factor_provenance: mom_multiasset_ai_r2_static_formula_transfer_v1
  live_llm_inference: false
  forward_epoch_utc: '2026-07-30T00:00:00-04:00'
  minimum_bound_forward_sessions: 20
  minimum_matched_tca_observations: 30
  order_authority: false
  broker_writes: false

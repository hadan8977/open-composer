name: us_mom_minute_p1_time_series_qr1
description: Research-only QQQ-signal/TQQQ-exposure minute time-series momentum matrix for Step 9.4 mom_minute_r1.
timeframe: 30m
universe:
  - QQQ
  - TQQQ
lifecycle: draft

entry:
  all:
    - close > ema(close, 24)
    - roc(close, 24) > 0

exit:
  any:
    - close < ema(close, 24)
    - roc(close, 24) <= 0

risk:
  max_trades_per_day: 6
  max_position_weight: 1.0
  stop_loss_pct: 4.0
  take_profit_pct: 12.0

costs:
  commission_pct: 0.0
  slippage_bps: 3.0
  impact_model: linear
  impact_eta: 0.0
  impact_gamma: 0.0

execution:
  backend: python_reference
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none

data:
  source: alpaca
  symbol: QQQ
  path: data/research/alpaca_minute/qqq_30m_alpaca_iex.csv
  feed: iex

data_assumptions:
  source: alpaca
  adjusted: true
  timezone: America/New_York
  acquisition_tier: research_replay_cache

llm_review:
  enabled: false

required_capabilities:
  - market.alpaca_bars

notes:
  intent: >
    Research-only Step 9.4 path P1. Signals are computed from QQQ minute bars
    and evaluated on TQQQ exposure by the dedicated mom_minute_r1 harness.
  research_design:
    iter_id: mom_minute_r1
    data_timeframe: 30m_or_1h
    signal_timeframe: 30m_or_1h
    rebalance_frequency: bar_close
    method_variants:
      - time_series_momentum
      - ema_cross_exit
      - atr_trail_exit
    factor_variants:
      - qqq_close_to_close_momentum
      - qqq_ema_trend
      - qqq_atr_trail
    parameter_ranges:
      timeframe: [30m, 1h]
      lookback_bars: [12, 24, 48, 96]
      exit_style: [ema_cross, atr_trail]
    benchmark_family:
      - QQQ_buy_hold
      - TQQQ_buy_hold
      - SPY_market_proxy
      - BIL_cash_proxy
      - naive_same_timeframe_momentum
    candidate_cap: 16
    objective: net_return_after_wave_9_2_costs
  caveats:
    - Research-only Alpaca/IEX minute cache; not SIP/full-market or paper-ready evidence.
    - This draft is not used by active specs or paper automation.

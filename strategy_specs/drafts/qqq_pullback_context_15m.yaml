name: qqq_pullback_context_15m
description: QQQ pullback strategy with event, macro, and news context.
timeframe: 15m
universe:
- QQQ
lifecycle: draft
entry:
  all:
  - close > ema(close, 5)
  - rsi(close, 3) < 75
  - volume > sma(volume, 3)
  any: []
exit:
  all: []
  any:
  - rsi(close, 3) > 82
  - close < ema(close, 5)
risk:
  max_trades_per_day: 3
  max_position_weight: 0.2
  stop_loss_pct: 1.2
  take_profit_pct: 2.0
execution:
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none
data:
  source: sample
  symbol: QQQ
  path: data/sample/qqq_15m.csv
  feed: null
data_assumptions:
  source: sample
  adjusted: true
  timezone: America/New_York
llm_review:
  enabled: true
  model: gpt-5.5
notes:
  intent: Buy pullbacks only after deterministic technical confirmation; attach company
    event, macro, and news context before manual or paper action.
  research_design:
    data_timeframe: 15m
    signal_timeframe: 15m
    rebalance_frequency: bar_close
    llm_review_frequency: post_signal_only
    method_variants:
    - pullback
    - context_filter
    factor_variants:
    - ema_trend
    - rsi_state
    - volume_confirmation
    - event_news_macro_context
    parameter_ranges:
      entry_ema_bars:
      - 3
      - 5
      - 8
      rsi_bars:
      - 3
      - 6
      stop_loss_pct:
      - 0.8
      - 1.2
      take_profit_pct:
      - 1.5
      - 2.0
    universe_variants:
    - - QQQ
    candidate_cap: 200
    objective: alpha_vs_benchmark_family_after_costs
  open_questions:
  - Evaluate Alpaca IEX versus paid SIP before relying on intraday fills.
  - Measure Alpha Vantage and GDELT coverage against the active watchlist.
required_capabilities:
- market.sample_ohlcv
- events.sec_filings
- macro.fred_series
- news.alpha_vantage
- news.gdelt

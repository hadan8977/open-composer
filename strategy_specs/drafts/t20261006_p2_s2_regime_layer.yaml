  candidate_budget: 9
  selection_objective: 'Decision object S3 (5-offset blend 0,4,8,12,16 with the frozen vol target 0.40 and dip boost), multiplier from the market regime with a one-day delay, 10 bp per side. PASS_SHADOW needs (a) stress 2017-10-02..2023-08-31 Sharpe minus the exposure-matched volatility-target S3 >= +0.10 and recent 2024-01-08..2026-09-17 >= -0.10, (b) stress Sharpe minus ungated S3 >= +0.10, (c) circular-shift placebo percentile >= 0.80 on 2017-10-02..2026-09-17, (d) >= 4 of 5 offsets with stress difference to the volatility target > 0, (e) (a) also at 20 bp, (f) <= 3 multiplier changes per year, and for JM/HMM/GMM specs the Stage 2a replication gate. Among PASS_SHADOW specs the highest stress difference to the volatility target wins; ties within 0.02 go to fewer changes per year.'
  candidate_budget_note: 'Axis sweep, not a factorial: J3_CV (paper base), J3_L15, J3_L50, J3_L150 (persistence axis), J4_CV, J6_CV (input axis), H2_CV, G2, TV (model axis). Report-only, not candidates: S1, S2, C2 and the index-level results, a 0.5 bear multiplier for J3_CV, the zero-delay sensitivity, crash-episode table.'
  anti_overfit_notes:
  - Frozen before any regime state, multiplier or gated return was computed on our data. Seen before writing are disclosed in hypotheses.md section 0 (the paper's tables, the registry verdicts, H-20260923-11, T-75, T-41).
  - Hyperparameters (jump penalty, HMM smoothing) are selected only by the index-level 0/1 strategy's trailing eight-year validation Sharpe, never on the sleeves.
  - The stress window is the decision window for the sleeve test; 2026-09-18 onward is not read.
  validation_plan:
  - 'Identity first: multiplier identically 1 reproduces the frozen sleeve engines (T-41 compute.py simulate_effective) within 1e-12; jump-model unit tests (synthetic two-regime recovery, truncation invariance of the online state, lambda 0 equals k-means assignment, lambda very large gives one state) and a cross-check against the jumpmodels package in an isolated environment.'
  - 'Stage 2a reproduction gate on 1990-2023, then the nine specifications at index level with the exposure-matched volatility target, then Stage 2b on the sleeves with placebos, 20 bp and the zero-delay sensitivity.'
  - 'Mechanical labels written by code from the frozen rule; the lead round reviews.'
notes:
  intent: Test at minimum effective depth whether a persistent online regime model raises the exposure-matched Sharpe of the levered pilot sleeve S3 (90% of the pilot's risk, stress Sharpe 0.59), as plan v2 section 3.2 Stage 2 requires before the owner's stress-period concern can be answered by a timing rule.

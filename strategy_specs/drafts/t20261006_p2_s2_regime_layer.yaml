factors:
  regime_multiplier:
    source: expression
    expression: close / lag(close, 1) - 1
    default: 0.0
    description: Documentation-only stand-in. The daily regime multiplier is computed by scripts/p2_s2_regime_layer.py from the market excess-return series (French daily Mkt-RF 1970-01-02..2015-12-31, SPY SIP total return minus RF from 2016-01-04), VIX (FRED VIXCLS) and Moody's Baa minus 10-year Treasury (FRED BAA10Y), with the jump model in open_composer/research/regime/jump_model.py; state at close d is applied from session d+2.
    params:
      decision_lag_sessions: 1

name: t20261006_p2_s2_regime_layer
description: 'P2 Stage 2 online regime layer, preregistered 2026-10-06 by the 07:07 lead round: a persistence-penalised statistical jump model (Shu-Yu-Mulvey 2024, JAM 25(5)) on market-level risk features, refit every six months on 3000 sessions, inferred online with a forward pass, used as a 0/1 exposure multiplier with a one-day delay. Stage 2a reproduces the paper on the US market 1990-2023 and sweeps nine specifications along three depth axes (inputs 3/4/6, jump penalty 15/50/150 plus cross-validated, model class JM/HMM/GMM/trend-x-VIX) at index level; Stage 2b applies the same daily multipliers to the paper sleeves S1, S2, S3 and C2 and judges S3 (the pilot sleeve) against an exposure-matched volatility target, the ungated sleeve and circular-shift placebos.'

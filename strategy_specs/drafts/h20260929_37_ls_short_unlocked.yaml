name: h20260929_37_ls_short_unlocked
description: >-
  Research-preregistration spec for iteration h20260929_37_ls_short_unlocked
  (queue T-20260929-37). Sixteen low-turnover long/short candidates in three
  directions (dual-class share-pair z-score, ETF-crash constituent laggards vs
  short ETF, sector-SPDR intramonth momentum) evaluated by
  scripts/run_h20260929_37_ls_short_unlocked.py under the frozen screen_lane
  contract (10 bp per side, close signal -> next open fill, all rebalance
  offsets / entry delays) with Alpaca-style borrow tiers deducted. The nominal
  entry/exit/portfolio fields are placeholders; short books are executed by the
  dedicated script and the schema cap of 1.0 does not express the real gross
  exposure of about 2x. Research only; no broker writes; lifecycle stays draft.

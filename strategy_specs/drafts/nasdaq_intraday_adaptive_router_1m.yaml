name: nasdaq_intraday_adaptive_router_1m
description: Adaptive NASDAQ intraday router that scans the market state and routes into internal opening-momentum, opening-reversal, or midday continuation sub-strategies.
timeframe: 1m
universe:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - META
  - GOOGL
  - AVGO
  - AMD
  - QCOM
  - AMAT
  - NFLX
  - TSLA
lifecycle: draft

entry:
  all:
    - "close > ema(close, 8)"
  any:
    - "volume > sma(volume, 20)"

exit:
  all: []
  any:
    - "close < ema(close, 8)"
    - "rsi(close, 3) > 80"

risk:
  max_trades_per_day: 3
  max_position_weight: 0.15
  stop_loss_pct: 0.9
  take_profit_pct: 1.6

portfolio:
  mode: adaptive_intraday_internal_router
  max_symbols_per_day: 1
  gross_exposure_limit: 0.15
  max_symbol_weight: 0.15
  same_day_flatten: true
  duplicate_signal_policy: stable_signal_id
  selected_route_label: open_reversal:lb10_entry5_top1_open0_mom0_rv0.8_qprior_negative_reversal_maxopen-0.2_maxmomnone__open_momentum:lb10_entry5_top1_open0_mom0_rv0.8_qprior_negative

costs:
  commission_pct: 0.005
  slippage_bps: 2.0
  impact_model: linear

execution:
  backend: python_reference
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none

data:
  source: alpaca
  symbol: AAPL
  feed: iex

data_assumptions:
  source: alpaca
  adjusted: true
  timezone: America/New_York

factors:
  qqq_session_return_proxy:
    source: expression
    expression: "(close / lag(close, 1) - 1) * 100"
    default: 0.0
    description: Session return proxy for QQQ regime scanning.
  qqq_momentum_proxy:
    source: expression
    expression: "close / lag(close, 60) - 1"
    default: 0.0
    description: Rough 60-bar intraday momentum proxy.
  qqq_relative_volume_proxy:
    source: expression
    expression: "volume / sma(volume, 20)"
    default: 0.0
    description: Relative volume pressure proxy.
  news_sentiment_gate:
    source: feature_packet
    path: feature_logs/nasdaq_intraday_adaptive_router_1m_news_features.jsonl
    field: sentiment_score
    default: 0.0
    description: Replayable news sentiment gate when PIT feature packets are available.

llm_review:
  enabled: true
  model: gpt-5.5

required_capabilities:
  - market.alpaca_bars
  - news.alpha_vantage
  - news.gdelt

notes:
  intent: Use one strategy with internal route scanning to adapt between opening momentum, opening reversal, and midday continuation on NASDAQ names.
  research_design:
    data_timeframe: 1m
    signal_timeframe: 1m
    rebalance_frequency: daily
    llm_review_frequency: training_and_validation_only
    method_variants:
      - internal_route_open_momentum
      - internal_route_open_reversal
      - internal_route_midday_continuation
      - internal_route_midday_reversal
    factor_variants:
      - qqq_open_return
      - qqq_momentum_proxy
      - qqq_rel_volume
      - news_sentiment_gate
    parameter_ranges:
      lookback_days: [5, 10, 20]
      entry_after_bars: [1, 5, 15, 60]
      top_n: [1, 2]
      min_opening_return_pct: [0.0, 0.2]
      min_prior_momentum_pct: [0.0, 3.0]
      min_relative_volume: [0.8, 1.0]
      max_opening_return_pct: [0.0, -0.2, -0.5]
      market_gate:
        - none
        - qqq_open_positive
        - qqq_prior_negative
        - qqq_open_positive_prior_negative
    benchmark_family:
      - QQQ buy-and-hold
      - TQQQ buy-and-hold
      - TQQQ intraday-only
      - equal-weight universe intraday
      - equal-weight universe buy-and-hold
      - ex-post best symbol
    candidate_cap: 720
    objective: equal_weight_alpha
  open_questions:
    - Compare Alpaca IEX against Longbridge Nasdaq Basic and a consolidated feed if available.
    - Add replayable PIT feature packets for news and market regime scoring before claiming LLM contribution.
    - Decide whether midday route labels should be folded into open-family routes or kept separate for paper-auto promotion.

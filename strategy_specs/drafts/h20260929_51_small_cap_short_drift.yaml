name: h20260929_51_small_cap_short_drift
description: >-
  Research-preregistration spec for iteration h20260929_51_small_cap_short_drift
  (queue T-20260929-51, dir:small_cap_background_drift_short_basket).
  Step 1: nine ETF spread candidates -- short IWM/RSP/IJR/XRT/KRE against a
  trailing-beta long SPY hedge (monthly, weekly, 252d/63d beta, unhedged
  control) plus one mirror-long placebo -- evaluated by
  scripts/run_h20260929_51_small_cap_short_drift.py under the frozen
  screen_lane windows/cost contract (10 bp per side, close signal -> next
  open fill, all rebalance offsets) with a 0.5%/yr ETF borrow fee deducted.
  The nominal entry/exit/portfolio fields are placeholders (short spread
  books are executed by the dedicated script, as with other screen-evaluated
  drafts; the schema caps weights at 1.0 so the real gross exposure of about 2.1x is not expressed here). Research only; no broker writes; lifecycle stays draft.
timeframe: daily
universe:
- IWM
- RSP
- IJR
- XRT
- KRE
- SPY
- SHY
lifecycle: draft
position_direction: long_short
entry:

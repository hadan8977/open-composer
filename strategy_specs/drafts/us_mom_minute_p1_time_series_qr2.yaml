name: us_mom_minute_p1_time_series_qr2
description: Research-only QQQ-signal/TQQQ-exposure lockbox momentum matrix for Step 9.R mom_minute_r2.
timeframe: 30m
universe:
  - QQQ
  - TQQQ
lifecycle: draft

entry:
  all:
    - close > ema(close, 24)
    - roc(close, 24) > 0

exit:
  any:
    - close < ema(close, 24)
    - roc(close, 24) <= 0

risk:
  max_trades_per_day: 6
  max_position_weight: 1.0
  stop_loss_pct: 4.0
  take_profit_pct: 12.0

costs:
  commission_pct: 0.0
  slippage_bps: 3.0
  impact_model: linear
  impact_eta: 0.0
  impact_gamma: 0.0

execution:
  backend: python_reference
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none

data:
  source: alpaca
  symbol: QQQ
  path: data/research/alpaca_minute/qqq_30m_alpaca_iex.csv
  feed: iex

data_assumptions:
  source: alpaca
  adjusted: true
  timezone: America/New_York
  acquisition_tier: research_replay_cache

llm_review:
  enabled: false

required_capabilities:
  - market.alpaca_bars

notes:
  intent: >
    Research-only Step 9.R path P1. Signals are computed from QQQ bar closes,
    executed from the next TQQQ bar open, and evaluated by the dedicated
    mom_minute_r2 lockbox harness.
  research_design:
    iter_id: mom_minute_r2
    data_timeframe: 30m
    signal_timeframe: 30m
    rebalance_frequency: bar_close
    method_variants:
      - time_series_momentum
      - rolling_atr_filter
    factor_variants:
      - qqq_close_to_close_momentum
      - qqq_rolling_atr_filter
    parameter_ranges:
      timeframe: [30m]
      lookback_bars: [72, 96, 120]
      atr_filter_multiplier: [1.5, 2.0, 2.5]
    benchmark_family:
      - QQQ_buy_hold
      - TQQQ_buy_hold
      - SPY_market_proxy
      - XLK_sector_theme_proxy
      - BIL_cash_proxy
      - equal_weight_universe
      - ex_post_best_symbol
      - naive_same_timeframe_momentum
    candidate_cap: 9
    objective: untouched_lockbox_return_after_costs
  caveats:
    - Research-only Alpaca/IEX minute cache; not SIP/full-market or paper-ready evidence.
    - This draft is not used by active specs or paper automation.

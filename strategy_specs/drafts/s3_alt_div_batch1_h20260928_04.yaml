    source: expression
    expression: close / lag(close, 21) - 1
    default: 0.0
    description: Documentation-only stand-in. The actual per-candidate target
      weight vector is computed by scripts/screen_batches/h20260928_04_batch1.py's
      per-candidate w_<id>(close, asof) function from each source's published
      rule (13612W or 1/3/6/12-month momentum, canary/breadth crash protection,
      or the fund's own NAV for hold-only candidates), evaluated using only
      rows with index <= asof, not by the generic per-symbol factor engine --
      several rules blend a multi-asset ranking and canary gate outside the
      single-symbol expression grammar.
    params:
      decision_lag_sessions: 1

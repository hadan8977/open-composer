name: s3_alt_div_batch1_h20260928_04
description: Preregistered H-20260928-04 batch-screening candidate family. Tests
  19 published, long-only, US-listed-ETF rules for whether each clears K1 (its
  date-neutral Sharpe, median over rebalance-day offsets, is at least 80% of S3's
  in both the anchor window 2024-01-08..2026-09-17 and the stress window
  2016-05-02..2023-09-15, with positive CAGR at 20bp) or K2 (a 63-session
  trailing-inverse-vol monthly blend with S3 beats a vol-matched k*S3 + (1-k)*SHY
  by >=0.05 Sharpe in both windows). Families -- F1 managed-futures ETFs held
  outright (DBMF, KMLM, CTA, WTMF, FMF); F2 Keller/Antonacci/Faber published
  tactical-allocation rules computed over public ETF universes (VAA-G4, DAA-G12,
  PAA-CPR, HAA, GPM, GEM, GTAA5, ADM, BAA-balanced); F3 other long-only ETFs held
  outright with a plausible low-bear-correlation-to-levered-semis mechanism
  (RPAR, UPAR, NTSX, QAI, TRTY). Every candidate is a pure function of the
  public rule and public price history only; no parameter in this file was
  fit to any window's return. Research only, deterministic, next-session
  execution; no broker writes are authorized. No backtest is run under this
  spec by this round -- screening happens in scripts/screen_batches/h20260928_04_batch1.py
  under a separate screening lane; this draft exists only to bind the
  preregistered candidate manifest to a StrategySpec content hash.

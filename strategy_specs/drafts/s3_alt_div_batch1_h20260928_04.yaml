  candidate_budget: 19
  selection_objective: No ranking among the 19 candidates. Each is judged only
    against the two fixed preregistered gates K1 (own date-neutral Sharpe vs
    80% of S3's, both windows, plus positive 20bp CAGR) and K2 (63-session
    trailing-inverse-vol monthly blend with S3 vs a vol-matched k*S3+(1-k)*SHY
    control, +0.05 Sharpe in both windows). A candidate is kept if it clears
    K1 or K2; DSR is reported with n_trials = 19 (this batch's size) because
    that is the correct multiple-comparisons denominator for whichever
    candidates pass.
  anti_overfit_notes:
  - Every candidate implements its source's published rule with the source's
    published parameters (lookback windows, top-N, canary universe, breadth
    denominator); none of these parameters was chosen by looking at this
    batch's own return data.
  - F1 and F3 candidates ("hold the fund") have no free parameter at all --
    the fund's own live NAV since inception is the candidate.
  - F2_BAA_BAL and F2_ADM were previously screened in
    reports/research/iterations/giants_sweep_20260922/ under the frozen G1-G5
    gate contract and did not pass; they are re-included here only because
    the acceptance criterion changed to K1/K2 relative to S3, not because any
    parameter was retuned. Their prior result is carried in
    candidate-manifest.json and direction-review.json.
  - This dossier stage is preregistration only -- no backtest, no Sharpe, no
    return number for any of the 19 candidates is computed under this round
    before pre-backtest validation passes.
  validation_plan:
  - s3_stress_window_2016_05_02_to_2023_09_15
  - s3_anchor_window_2024_01_08_to_2026_09_17
  - holdout_2026_01_02_to_2026_09_17_contaminated_reference_only
  - date_neutral_median_over_rebalance_offsets_monthly_0_20_weekly_0_4
  - k1_vs_80pct_of_s3_sharpe_both_windows_plus_20bp_positive_cagr
  - k2_inverse_vol_blend_with_s3_vs_vol_matched_k_s3_plus_1_minus_k_shy
  - next_session_execution_with_ten_and_twenty_bps_cost_views
  - dsr_reported_with_n_trials_equal_19
notes:
  intent: Hand a batch-screening lane (built by another agent) 19 well-researched,
    preregistered, long-only public-ETF-rule candidates that could plausibly
    clear the owner's relaxed K1/K2 keep rule for a strategy that only has S3
    passing all frozen gates, without duplicating S1/S2/S3, Defense First, the
    TLT/GLD/DBC/UUP-vs-SHY queue task, or Step 10's cross-asset TSMOM.

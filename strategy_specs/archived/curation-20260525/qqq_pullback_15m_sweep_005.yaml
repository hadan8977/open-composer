name: qqq_pullback_15m_sweep_005
description: QQQ pullback strategy with short sample-data windows for MVP verification.
  Parameter sweep candidate 5.
timeframe: 15m
universe:
- QQQ
lifecycle: draft
entry:
  all:
  - close > ema(close, 5)
  - rsi(close, 3) < 75
  - volume > sma(volume, 3)
  any: []
exit:
  all: []
  any:
  - rsi(close, 3) > 82
  - close < ema(close, 5)
risk:
  max_trades_per_day: 3
  max_position_weight: 0.2
  stop_loss_pct: 0.8
  take_profit_pct: 2.0
costs:
  commission_pct: 0.0
  slippage_bps: 0.0
  impact_model: linear
  impact_eta: 0.0
  impact_gamma: 0.0
execution:
  backend: python_reference
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none
data:
  source: sample
  symbol: QQQ
  path: data/sample/qqq_15m.csv
  feed: null
data_assumptions:
  source: sample
  adjusted: true
  timezone: America/New_York
factors: {}
llm_review:
  enabled: false
  model: null
notes:
  intent: Buy short-window pullbacks during a positive sample trend and exit on recovery
    or trend damage.
  open_questions:
  - Replace short sample windows with production windows after real-data validation.
  research_design:
    data_timeframe: 15m
    signal_timeframe: 15m
    rebalance_frequency: bar_close
    llm_review_frequency: post_signal_only
    method_variants:
    - pullback
    - breakout
    - trend_follow
    factor_variants:
    - ema_trend
    - rsi_state
    - volume_confirmation
    parameter_ranges:
      entry_ema_bars:
      - 3
      - 5
      - 8
      - 13
      rsi_bars:
      - 3
      - 6
      - 14
      stop_loss_pct:
      - 0.8
      - 1.0
      - 1.2
      - 1.5
      take_profit_pct:
      - 1.5
      - 2.0
      - 2.5
      - 3.0
    universe_variants:
    - - QQQ
    - - SPY
    candidate_cap: 200
    objective: alpha_vs_benchmark_family_after_costs
  parameter_sweep:
    source_strategy: qqq_pullback_15m
    candidate_index: 5
    params:
      risk.stop_loss_pct: 0.8
      risk.take_profit_pct: 2.0
      entry.all.0: close > ema(close, 5)
    promotion_note: In-sample sweep result only; require out-of-sample, walk-forward,
      cost sensitivity, and data-source comparison before paper promotion.
required_capabilities:
- market.sample_ohlcv
- events.sec_filings
- macro.fred_series
- news.alpha_vantage

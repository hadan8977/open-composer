name: audit_stop_take_daily
description: "Audit fixture: tight stop loss + take profit on RSI mean reversion entries."
timeframe: daily
universe: [SYN]
lifecycle: draft
entry:
  all:
  - rsi(close, 2) < 10
  any: []
exit:
  all: []
  any:
  - rsi(close, 2) > 70
risk:
  max_trades_per_day: 1
  max_position_weight: 1.0
  stop_loss_pct: 2.0
  take_profit_pct: 4.0
costs:
  commission_pct: 0.0
  slippage_bps: 0.0
  impact_model: linear
  impact_eta: 0.0
  impact_gamma: 0.0
execution:
  backend: python_reference
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none
data:
  source: sample
  symbol: SYN
  path: data/sample/syn_daily.csv
  feed: null
data_assumptions:
  source: sample
  adjusted: true
  timezone: America/New_York
factors: {}
llm_review:
  enabled: false
notes:
  intent: "Validate stop_loss_pct=2 and take_profit_pct=4 hit logic."
  open_questions: []
required_capabilities:
- market.sample_ohlcv

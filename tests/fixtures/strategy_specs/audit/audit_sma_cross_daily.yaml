name: audit_sma_cross_daily
description: "Audit fixture: classic 50/200 SMA golden cross."
timeframe: daily
universe: [SYN]
lifecycle: draft
entry:
  all:
  - sma(close, 50) > sma(close, 200)
  any: []
exit:
  all: []
  any:
  - sma(close, 50) < sma(close, 200)
risk:
  max_trades_per_day: 1
  max_position_weight: 1.0
costs:
  commission_pct: 0.0
  slippage_bps: 0.0
  impact_model: linear
  impact_eta: 0.0
  impact_gamma: 0.0
execution:
  backend: python_reference
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none
data:
  source: sample
  symbol: SYN
  path: data/sample/syn_daily.csv
  feed: null
data_assumptions:
  source: sample
  adjusted: true
  timezone: America/New_York
factors: {}
llm_review:
  enabled: false
notes:
  intent: "50/200 SMA golden cross / death cross for backtest correctness audit."
  open_questions: []
required_capabilities:
- market.sample_ohlcv

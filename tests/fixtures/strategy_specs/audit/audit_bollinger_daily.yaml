name: audit_bollinger_daily
description: "Audit fixture: Bollinger Bands mean reversion (enter at lower band, exit at mid)."
timeframe: daily
universe: [SYN]
lifecycle: draft
entry:
  all:
  - close < bollinger_lower(close, 20, 2.0)
  any: []
exit:
  all: []
  any:
  - close > bollinger_mid(close, 20)
risk:
  max_trades_per_day: 1
  max_position_weight: 1.0
costs:
  commission_pct: 0.0
  slippage_bps: 0.0
  impact_model: linear
  impact_eta: 0.0
  impact_gamma: 0.0
execution:
  backend: python_reference
  mode: manual_signal
  signal_on: bar_close
  fill_assumption: next_bar_open
  broker: none
data:
  source: sample
  symbol: SYN
  path: data/sample/syn_daily.csv
  feed: null
data_assumptions:
  source: sample
  adjusted: true
  timezone: America/New_York
factors: {}
llm_review:
  enabled: false
notes:
  intent: "Validate Bollinger Bands indicator parity."
  open_questions: []
required_capabilities:
- market.sample_ohlcv

version: 1

# Skill manifest maps skill names to their trigger conditions and primary outputs.
# Used as the skill trigger/parity index. Runtime risk-domain requirements for
# `oc harness plan` come from `harness/risk_domains.yaml`; repo check verifies
# every risk-domain required skill is also present here, and validates this
# manifest's skill, hook, and agent paths so the trigger index does not drift.
#
# Codex reads this file progressively — only skill metadata is loaded at start;
# full SKILL.md is loaded when the skill is selected.

skills:

  strategy-research-orchestrator:
    description: >
      Coordinates strategy research, optimization and lifecycle decisions using
      applicable native gates; adapts methods to the research object and stage.
      Component or agent-method work does not require an unrelated strategy.
    triggers:
      - user requests strategy research, optimization, or evaluation
      - user requests strategy promotion or paper readiness
    primary_outputs:
      - reports/harness/plans/{strategy}.json
      - reports/research/{strategy}-research-brief.json
      - reports/research/{strategy}-evidence-manifest.json
    skill_path: .agents/skills/strategy-research-orchestrator/SKILL.md

  idea-to-paper:
    description: >
      Turns an investment or research idea into a source-led economic decision,
      including factors, data, models, timing and execution. Unrelated product,
      documentation and agent-method maintenance do not use this workflow.
    triggers:
      - owner states an investment or strategy-research idea or challenge
      - a new economic research direction is opened
    primary_outputs:
      - reports/research/control/briefs/{task}.md
      - reports/research/iterations/{iteration}/direction-review.json
      - reports/research/intel/sources/{topic}/
    skill_path: .agents/skills/idea-to-paper/SKILL.md

  source-researcher:
    description: >
      Performs mandatory web research for unstable external facts: broker API,
      exchange rules, data provider specs, methodology papers, recent platform docs.
      Generates source cards for every claim that affects strategy design.
    triggers:
      - any strategy needing broker / order type verification
      - any strategy needing exchange auction rule verification
      - any strategy referencing external data providers
      - any strategy using backtest methodology claims
      - risk domain broker_specific or daily_open_execution is active
    primary_outputs:
      - reports/harness/source_cards/{strategy}.jsonl
    skill_path: .agents/skills/source-researcher/SKILL.md

  execution-reality-reviewer:
    description: >
      Reviews order type, TIF, price protection, spread/gap filters, participation cap,
      slippage stress, and TCA for strategies with daily open or paper_auto execution.
      Compares at least two execution methods.
    triggers:
      - execution.mode == paper_auto
      - fill_assumption in [next_bar_open, next_open]
      - risk domain daily_open_execution or leveraged_etf is active
      - user asks about order types, execution, slippage, or TCA
    primary_outputs:
      - reports/harness/execution/{strategy}-execution-policy.json
      - reports/harness/execution/{strategy}-execution-reality.json
      - reports/harness/execution/{strategy}-execution-reality.md
    skill_path: .agents/skills/execution-reality-reviewer/SKILL.md

  backtest-forensics:
    description: >
      Checks for lookahead, future-leak, overfit, multiple-testing, short sample,
      low trade count, and sample data caveats. Required for parameter-optimized
      strategies and before promotion.
    triggers:
      - strategy has adjustable parameters or uses an optimizer
      - risk domain parameter_search is active
      - promotion gate is being evaluated
      - user asks about overfitting, PBO, DSR, or walk-forward
    primary_outputs:
      - reports/harness/forensics/{strategy}-backtest-forensics.json
      - reports/harness/forensics/{strategy}-backtest-forensics.md
    skill_path: .agents/skills/backtest-forensics/SKILL.md

  data-capability-reviewer:
    description: >
      Evaluates data capability registry against strategy requirements. Flags
      sample / fixture / cache-fallback data as non-paper-ready. Checks PIT
      metadata for LLM/news/event/macro features.
    triggers:
      - new data source or timeframe added to strategy
      - risk domain llm_or_news_signal is active
      - user asks about data coverage, PIT, or feature packets
      - capability.status == trial
    primary_outputs:
      - reports/harness/data/{strategy}-capability-review.json
    skill_path: .agents/skills/data-capability-reviewer/SKILL.md

  paper-auto-safety-reviewer:
    description: >
      Safety review for paper_auto activation: lifecycle, kill switch, order window,
      duplicate order policy, credential scope, broker capability, audit linkage,
      and harness verify status.
    triggers:
      - execution.mode == paper_auto being activated
      - paper order submission flow
      - runner or timer configuration changed
      - risk domain paper_auto is active
    primary_outputs:
      - reports/harness/paper/{strategy}-paper-safety-review.json
    skill_path: .agents/skills/paper-auto-safety-reviewer/SKILL.md

  capability-evaluator:
    description: >
      Evaluate market, event, macro, and news data capabilities before allowing
      a strategy to depend on them.
    triggers:
      - new capability kind added to strategy
      - capability.status == trial
      - oc capability test called
    skill_path: .agents/skills/capability-evaluator/SKILL.md

  python-backtest-writer:
    description: >
      Implement or update deterministic Python signal, scanner, and backtest
      behavior for a StrategySpec.
    triggers:
      - strategy.lifecycle in [draft, research]
      - user requests Python backtest implementation
    skill_path: .agents/skills/python-backtest-writer/SKILL.md

  strategy-designer:
    description: >
      Create or revise Open Composer StrategySpec YAML files from natural-language
      trading ideas.
    triggers:
      - user gives a new trading idea
      - user requests spec revision
    skill_path: .agents/skills/strategy-designer/SKILL.md

  risk-reviewer:
    description: >
      Review a candidate signal, strategy report, and market context for manual
      or paper-trading risk.
    triggers:
      - signal generated and ready for review
      - user requests risk review of a specific signal or report
    skill_path: .agents/skills/risk-reviewer/SKILL.md

  nautilus-trader-adapter:
    description: >
      Implement or update NautilusTrader-backed execution, backtest, and custom
      data adapters for Open Composer StrategySpecs.
    triggers:
      - user requests NautilusTrader execution parity
      - execution_policy references nautilus adapter
    skill_path: .agents/skills/nautilus-trader-adapter/SKILL.md

  research-plan-reviewer:
    description: >
      Independently reviews new economic hypotheses, material scientific
      definition changes or work beyond approved scope. Routine authorized
      execution and same-semantics repair use relevant diff/result acceptance.
    triggers:
      - a new economic hypothesis requires independent review
      - a material scientific definition or approved research scope changes
    skill_path: .agents/skills/research-plan-reviewer/SKILL.md

  windows-paseo-worker:
    description: >
      Routes memory-heavy research work to the owner's Windows computer through
      Paseo, with the fixed C:\\paseo root, 50 GiB cap, preflight, manifest,
      hash verification, pause controls, and cleanup requirements.
    triggers:
      - a research task needs the Windows compute worker
      - a session asks how to connect to or pause the Windows worker
      - a remote research task needs transfer or cleanup rules
    primary_outputs:
      - config/windows-paseo-worker.json
      - reports/research/control/autonomous-log.md
    skill_path: .agents/skills/windows-paseo-worker/SKILL.md

# Automatic Claude hooks retired by the owner-approved restructure.
hooks: {}

# ── Subagent templates ──────────────────────────────────────────────────────────
# Agent templates in .claude/agents/ describe research-agent roles, I/O contracts,
# and constraints. They are invoked by the strategy-research-orchestrator or by
# the user via the Claude Code Agent tool.

agents:
  source-research-agent:
    path: .claude/agents/source-research-agent.md
    role: mandatory-web-research
    skills_used: [source-researcher]

  backtest-forensics-agent:
    path: .claude/agents/backtest-forensics-agent.md
    role: forensic-backtest-review
    skills_used: [backtest-forensics]

  execution-reality-agent:
    path: .claude/agents/execution-reality-agent.md
    role: execution-reality-review
    skills_used: [execution-reality-reviewer]

  paper-safety-agent:
    path: .claude/agents/paper-safety-agent.md
    role: paper-auto-safety-review
    skills_used: [paper-auto-safety-reviewer]

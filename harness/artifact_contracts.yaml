version: 1

# Artifact contracts define the required path pattern and minimum fields for
# each artifact type. The harness verifier checks these contracts to determine
# whether an artifact is present and structurally complete.
#
# path: may use {strategy} as a placeholder for the strategy name.
# required_fields: top-level keys that must be non-null.
# format: jsonl | json | yaml | md

artifacts:

  source_cards:
    description: >
      Point-in-time citations for every unstable external claim (broker API,
      exchange rules, data provider specs, recent papers or platform docs).
    path: reports/harness/source_cards/{strategy}.jsonl
    format: jsonl
    required_fields:
      - claim_id
      - claim
      - source_url
      - source_type
      - accessed_at
      - applies_to
      - impact_on_spec
      - limitations
    source_types:
      - broker_official_docs
      - exchange_official_docs
      - provider_official_docs
      - regulatory_docs
      - paper
      - platform_docs
      - industry_standard
    required_claim_ids:
      - "{strategy}:source-research"

  pit_universe_membership:
    description: >
      Official or authorized point-in-time universe membership evidence used to
      prevent current-symbol and survivorship bias in multi-symbol strategy
      research. A boolean StrategySpec note is not sufficient; the audit must
      read this artifact.
    path: reports/research/{strategy}-pit-universe.json
    format: json
    required_fields:
      - strategy_name
      - source_type
      - source_url
      - as_of
      - selection_timestamp
      - delisting_policy
      - memberships

  execution_policy:
    description: >
      Structured comparison of execution methods for the strategy.
      Must document at least two order styles, price protection, fallback, and TCA plan.
    path: reports/harness/execution/{strategy}-execution-policy.json
    format: json
    required_fields:
      - strategy_name
      - policy_id
      - order_style
      - time_in_force
      - price_protection
      - gap_filter
      - spread_filter
      - participation_cap
      - fallback_behavior
      - tca_plan
      - source_card_ids
      - alternatives_compared

  execution_reality_report:
    description: >
      Analysis of slippage stress, gap scenarios, capacity, and TCA for the
      chosen execution policy.
    path: reports/harness/execution/{strategy}-execution-reality.json
    format: json
    required_fields:
      - strategy_name
      - policy_id
      - slippage_scenarios
      - gap_stress
      - capacity_assessment
      - tca_reference_prices

  trial_ledger:
    description: >
      Append-only record of every parameter set trialed during optimization.
      Enables PBO/DSR risk assessment and prevents silent overfitting.
    path: reports/research/{strategy}-trial-ledger.jsonl
    format: jsonl
    required_fields:
      - trial_id
      - parameter_set
      - data_profile
      - train_window
      - test_window
      - metrics
      - selected
      - rejection_reason

  bounded_search_space:
    description: >
      Declaration of the complete parameter search space before optimization runs.
      Documents what was searched, not just what was selected.
    path: reports/research/{strategy}-search-space.json
    format: json
    required_fields:
      - strategy_name
      - parameters
      - total_combinations
      - search_method
      - created_at

  candidate_set:
    description: >
      Shortlist of parameter candidates from optimization, with selection rationale.
    path: reports/research/{strategy}-candidate-set.json
    format: json
    required_fields:
      - strategy_name
      - candidates
      - selection_criteria
      - selected_candidate_id

  walk_forward_report:
    description: >
      Walk-forward or OOS validation evidence for optimized strategies.
    path: reports/research/{strategy}-walk-forward.json
    format: json
    required_fields:
      - strategy_name
      - method
      - windows
      - oos_metrics
      - conclusion

  regime_performance_report:
    description: >
      Leak-free regime-aware strategy return attribution. Labels each bar with
      trailing-information market regimes and reports worst-regime performance.
    path: reports/research/{strategy}-regime-performance.json
    format: json
    required_fields:
      - strategy_name
      - status
      - regimes
      - min_regime_sharpe
      - min_regime_return_pct
      - blockers
      - warnings

  alpha_decay_report:
    description: >
      Lightweight alpha-decay proxy for front-loaded returns, recent Sharpe
      degradation, and stale-edge risk.
    path: reports/research/{strategy}-alpha-decay.json
    format: json
    required_fields:
      - strategy_name
      - status
      - slope
      - recent_sharpe
      - old_sharpe
      - pnl_concentration_old
      - alpha_stale
      - blockers
      - warnings

  factor_panel_report:
    description: >
      Cross-sectional non-ML factor panel diagnostics with ICIR, t-stat,
      horizon decay, quantile returns, turnover, correlation, and optional
      group/bucket neutralized RankIC.
    path: reports/research/{strategy}-factor-lab-v2.json
    format: json
    required_fields:
      - status
      - panel_path
      - factor_metrics
      - factor_correlation_matrix
      - quality_flags

  market_data_manifest:
    description: >
      Tick/L1/L2 local fixture manifest used for research-only replay and
      execution simulation readiness evidence.
    path: reports/data/market_data/{symbol}-{kind}-manifest.json
    format: json
    required_fields:
      - kind
      - path
      - symbol
      - first_timestamp
      - last_timestamp
      - row_count
      - source
      - quality_flags
      - sha256

  execution_sim_report:
    description: >
      Research-only execution simulation report backed by a market-data manifest
      and NautilusTrader backend compatibility plan.
    path: reports/research/{strategy}-execution-sim.json
    format: json
    required_fields:
      - strategy_name
      - status
      - selected_backend
      - market_data_manifest_path
      - market_data_kind
      - blockers
      - warnings

  feature_packet_schema:
    description: >
      Schema and sample for every LLM/news/event/macro feature packet used by
      the strategy. Must include PIT metadata fields.
    path: reports/research/{strategy}-feature-packet-schema.json
    format: json
    required_fields:
      - strategy_name
      - packet_kind
      - visible_at
      - published_at
      - fetched_at
      - source
      - input_hash
      - prompt_hash
      - fields

  pit_replay_evidence:
    description: >
      Evidence that LLM/news/macro inputs are replayed from PIT packets during
      backtest, not via live API calls.
    path: reports/research/{strategy}-pit-replay.json
    format: json
    required_fields:
      - strategy_name
      - replay_method
      - pit_fields_verified
      - live_call_prohibited

  marginal_lift_report:
    description: >
      Comparison of strategy performance with vs. without LLM/news signal,
      proving the alternative data adds value over a deterministic baseline.
    path: reports/research/{strategy}-marginal-lift.json
    format: json
    required_fields:
      - strategy_name
      - baseline_sharpe
      - with_signal_sharpe
      - lift_pct
      - robustness_check

  missing_modality_robustness_report:
    description: >
      Evidence that the strategy degrades gracefully when LLM/news/macro
      input is unavailable or delayed.
    path: reports/research/{strategy}-modality-robustness.json
    format: json
    required_fields:
      - strategy_name
      - degradation_mode
      - fallback_behavior
      - performance_impact

  gap_stress_report:
    description: >
      Stress analysis of opening gap scenarios, specifically for leveraged ETFs
      or strategies with next_bar_open fill assumption.
    path: reports/harness/execution/{strategy}-gap-stress.json
    format: json
    required_fields:
      - strategy_name
      - scenarios
      - max_adverse_gap_pct
      - fill_model_gap_handling
      - recommended_gap_filter

  leveraged_etf_risk_note:
    description: >
      Written acknowledgment of leveraged ETF path-dependency and rebalance
      decay risk, with proposed mitigations.
    path: reports/harness/execution/{strategy}-leveraged-etf-risk.md
    format: md
    required_fields: []

  paper_safety_review:
    description: >
      Safety review for paper_auto activation: lifecycle, kill switch, order
      window, duplicate order policy, credential scope, audit linkage.
    path: reports/harness/paper/{strategy}-paper-safety-review.json
    format: json
    required_fields:
      - strategy_name
      - lifecycle_status
      - kill_switch_verified
      - order_window
      - duplicate_order_policy
      - credential_scope
      - signal_order_linkage

  router_order_authorization:
    description: >
      Explicit authorization that lets a router strategy move from
      observation_only target-weight cycles to Alpaca Paper broker orders.
      Missing authorization keeps router strategies observation-only even when
      paper readiness is otherwise green.
    path: reports/harness/paper/{strategy}-router-order-authorization.json
    format: json
    required_fields:
      - strategy_name
      - execution_substate
      - authorized
      - authorized_at
      - execution_policy_id
      - target_weights_path
      - rebalance_intents_path
      - paper_safety_review_path

  short_sample_caveat:
    description: >
      Written caveat for strategies with fewer than 252 trading days or
      fewer than 30 trades in the reference backtest.
    path: reports/research/{strategy}-short-sample-caveat.md
    format: md
    required_fields: []

  backtest_forensics:
    description: >
      Checklist of lookahead, future-leak, overfit, multiple-testing, and
      capacity risks identified in the reference backtest.
    path: reports/harness/forensics/{strategy}-backtest-forensics.json
    format: json
    required_fields:
      - strategy_name
      - lookahead_check
      - future_leak_check
      - overfit_risk
      - multiple_testing_count
      - sample_data_caveats
      - trade_count
      - conclusion

  router_target_weights:
    description: >
      Observation-only target-weight snapshot for router strategies.
    path: reports/execution/{strategy}-target-weights.json
    format: json
    required_fields:
      - strategy_name
      - source_spec_path
      - portfolio_mode
      - target_weights
      - summary
      - acquisition_tier

  router_rebalance_intents:
    description: >
      Rebalance intents derived from router target weights. Intents are not
      broker orders and remain observation-only until paper readiness authorizes execution.
    path: reports/execution/{strategy}-rebalance-intents.json
    format: json
    required_fields:
      - strategy_name
      - source_spec_path
      - portfolio_mode
      - intents
      - summary
      - execution_substate

  router_execution_observation:
    description: >
      Read-only execution observation state for router strategies, linking
      target weights, rebalance intents, cost stress, data evidence, and validation.
    path: reports/execution/{strategy}-execution-observation.json
    format: json
    required_fields:
      - strategy_name
      - source_spec_path
      - execution_substate
      - target_weights_path
      - rebalance_intents_path

  router_cost_stress:
    description: >
      Cost and turnover stress for router rebalance intents.
    path: reports/research/{strategy}-router-cost-stress.json
    format: json
    required_fields:
      - strategy_name
      - status
      - scenarios
      - recommendation

  router_data_evidence:
    description: >
      Data-source and acquisition-tier evidence for router target-weight generation.
    path: reports/research/{strategy}-router-data-evidence.json
    format: json
    required_fields:
      - strategy_name
      - status
      - data_source
      - acquisition_tier
      - data_profile

  router_validation:
    description: >
      Validation checks for router target weights against StrategySpec exposure limits.
    path: reports/research/{strategy}-router-validation.json
    format: json
    required_fields:
      - strategy_name
      - status
      - portfolio_mode
      - summary
      - blockers

  short_sale_source_cards:
    description: >
      Broker and rule source cards specific to short-selling capability.
    path: reports/harness/source_cards/{strategy}.jsonl
    format: jsonl
    required_fields:
      - claim_id
      - claim
      - source_url
      - source_type
      - accessed_at
      - applies_to
      - impact_on_spec
      - limitations
    required_claim_ids:
      - "{strategy}:short-paper-broker-verification-required"

  borrow_cost_estimate:
    description: >
      Borrow cost and locate assumptions for short-selling research.
    path: reports/research/{strategy}-borrow-cost-estimate.json
    format: json
    required_fields:
      - strategy_name
      - position_direction
      - status
      - borrow_rate_assumption_annual_pct
      - shortable_field_required

  short_squeeze_stress:
    description: >
      Short squeeze and adverse gap stress scenarios.
    path: reports/research/{strategy}-short-squeeze-stress.json
    format: json
    required_fields:
      - strategy_name
      - status
      - scenarios
      - kill_switch_recommendation

  ex_dividend_risk_note:
    description: >
      Written note covering dividend and corporate-action risk for short positions.
    path: reports/research/{strategy}-ex-dividend-risk-note.md
    format: md
    required_fields: []

  short_exposure_policy:
    description: >
      Exposure and authorization policy for short or long-short strategies.
    path: reports/harness/execution/{strategy}-short-exposure-policy.json
    format: json
    required_fields:
      - strategy_name
      - position_direction
      - max_gross_short_exposure
      - paper_auto_default
      - requires

  options_chain_source_cards:
    description: >
      Source cards for options chain data provider coverage, greeks, spreads,
      and broker/product rules.
    path: reports/harness/source_cards/{strategy}.jsonl
    format: jsonl
    required_fields:
      - claim_id
      - claim
      - source_url
      - source_type
      - accessed_at
      - applies_to
      - impact_on_spec
      - limitations
    required_claim_ids:
      - "{strategy}:options-chain-provider-coverage"

  greeks_profile:
    description: Options greeks exposure profile.
    path: reports/options/{strategy}-greeks-profile.json
    format: json
    required_fields:
      - strategy_name
      - instrument_type
      - delta
      - theta
      - vega

  roll_schedule:
    description: Roll schedule for options overlays.
    path: reports/options/{strategy}-roll-schedule.json
    format: json
    required_fields:
      - strategy_name
      - schedule
      - expiry_target

  iv_stress_report:
    description: Implied-volatility stress report for options.
    path: reports/options/{strategy}-iv-stress.json
    format: json
    required_fields:
      - strategy_name
      - scenarios
      - conclusion

  overlay_cost_report:
    description: Premium, spread, and carry cost report for options overlays.
    path: reports/options/{strategy}-overlay-cost.json
    format: json
    required_fields:
      - strategy_name
      - max_premium_pct
      - spread_assumption
      - conclusion

  assignment_risk_note:
    description: Written assignment and exercise risk note for options strategies.
    path: reports/options/{strategy}-assignment-risk.md
    format: md
    required_fields: []

  contract_selection_log:
    description: Contract selection log for primary options strategies.
    path: reports/options/{strategy}-contract-selection.jsonl
    format: jsonl
    required_fields:
      - selected_at
      - underlying
      - expiry
      - strike
      - right
      - rationale

  expiry_ladder:
    description: Expiry ladder considered for an options strategy.
    path: reports/options/{strategy}-expiry-ladder.json
    format: json
    required_fields:
      - strategy_name
      - expiries
      - selection_rule

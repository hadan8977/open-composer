<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Composer 代码地图</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --surface-2: #f3f3f0; --surface-3: #e8e8e4;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7975;
    --line: #d6d5cf; --edge: #b4b3ac; --edge-strong: #3d3c39;
    --cat-product: #2a78d6; --cat-domain: #1baf7a; --cat-research: #eb6834;
    --cat-store: #8a8985; --cat-external: #8a8985; --focus: #2a78d6;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #232322; --surface-3: #2e2e2c;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #9a998f;
    --line: #3a3a37; --edge: #4f4f4b; --edge-strong: #d9d8cf;
    --cat-product: #3987e5; --cat-domain: #199e70; --cat-research: #d95926;
    --cat-store: #9a998f; --cat-external: #9a998f; --focus: #3987e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface-1); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  a { color: inherit; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--surface-2); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; color: var(--text-secondary); background: var(--surface-1);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .chip b { color: var(--text-primary); font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  button, .toggle { font: inherit; font-size: 12.5px; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--text-muted); }
  button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
  button:focus-visible, .node:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .toggle input { margin: 0; }
  #search-wrap { position: relative; }
  #search { font: inherit; font-size: 12.5px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-1); color: var(--text-primary); width: 240px; }
  #search-results { position: absolute; top: 34px; left: 0; z-index: 20; width: 460px; max-height: 360px; overflow: auto;
    background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: none; }
  #search-results.open { display: block; }
  #search-results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
    border-radius: 0; padding: 6px 10px; font-size: 12px; }
  #search-results button small { color: var(--text-muted); margin-left: 6px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: calc(100% - 112px); }
  #canvas { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  aside { border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px 40px; background: var(--surface-1); }
  aside h2 { font-size: 16px; margin: 0 0 4px; }
  aside h3 { font-size: 12.5px; margin: 16px 0 6px; color: var(--text-secondary); text-transform: none; letter-spacing: .02em; }
  aside p { margin: 6px 0; color: var(--text-primary); }
  .muted { color: var(--text-muted); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
  .kv dt { color: var(--text-secondary); } .kv dd { margin: 0; }
  .list { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .list li { padding: 3px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; align-items: baseline; }
  .list li:last-child { border-bottom: 0; }
  .list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .list .num { color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .link { background: none; border: 0; padding: 0; color: var(--text-primary); text-decoration: underline;
    text-decoration-color: var(--line); cursor: pointer; font: inherit; font-size: 12.5px; text-align: left; }
  .link:hover { text-decoration-color: var(--text-primary); }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2);
    padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
  .file-row.hit { background: color-mix(in srgb, var(--focus) 14%, transparent); border-radius: 4px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .cat-product .swatch, .swatch.product { background: var(--cat-product); }
  .cat-domain .swatch, .swatch.domain { background: var(--cat-domain); }
  .cat-research .swatch, .swatch.research { background: var(--cat-research); }
  .swatch.store, .swatch.external { background: var(--cat-store); }
  .swatch.external { border-radius: 999px; }
  .step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
  .step .n { width: 22px; height: 22px; border-radius: 50%; background: var(--text-primary); color: var(--surface-1);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .step .t { font-weight: 600; }
  .step .d { color: var(--text-secondary); }
  #legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 16px; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--text-secondary); background: var(--surface-1); align-items: center; }
  #legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  #legend svg { width: 34px; height: 12px; }
  #tooltip { position: fixed; z-index: 30; pointer-events: none; display: none; max-width: 420px; padding: 8px 10px;
    background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.16); font-size: 12px; }
  #tooltip .k { color: var(--text-secondary); }
  #tables { display: none; padding: 12px 16px 40px; border-top: 1px solid var(--line); overflow: auto; background: var(--surface-1); }
  #tables.open { display: block; }
  table { border-collapse: collapse; font-size: 12px; margin: 8px 0 18px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  body.tables-open main { height: auto; min-height: 60vh; }
  /* svg */
  .col-title { fill: var(--text-secondary); font-size: 12.5px; font-weight: 600; letter-spacing: .04em; }
  .col-line { stroke: var(--line); stroke-dasharray: 3 5; }
  .edge { fill: none; stroke: var(--edge); stroke-opacity: .5; pointer-events: none; marker-end: url(#arrow); transition: stroke-opacity .15s; }
  .edge.kind-store { stroke-dasharray: 7 5; }
  .edge.kind-api { stroke-dasharray: 2 5; stroke-linecap: round; }
  .edge.kind-lib { stroke-dasharray: 1 4; stroke-opacity: .35; stroke-linecap: round; }
  .edge.hidden, .edge-hit.hidden { display: none; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
  svg.has-focus .edge { stroke-opacity: .07; marker-end: none; }
  svg.has-focus .edge.active { stroke-opacity: 1; stroke: var(--edge-strong); marker-end: url(#arrow-active); }
  svg.has-focus .node { opacity: .32; }
  svg.has-focus .node.active, svg.has-focus .node.neighbor { opacity: 1; }
  svg.flow-mode .edge { stroke-opacity: .05; marker-end: none; }
  svg.flow-mode .node { opacity: .28; }
  svg.flow-mode .node.in-flow { opacity: 1; }
  .flow-edge { fill: none; stroke: var(--text-primary); stroke-width: 3; marker-end: url(#arrow-flow); }
  .node { cursor: pointer; transition: opacity .15s; }
  .node.cat-product { --cat: var(--cat-product); }
  .node.cat-domain { --cat: var(--cat-domain); }
  .node.cat-research { --cat: var(--cat-research); }
  .node.cat-store, .node.cat-external { --cat: var(--cat-store); }
  .node .body { fill: var(--cat); fill-opacity: .13; stroke: var(--cat); stroke-width: 2; }
  .node.cat-external .body { stroke-dasharray: 7 4; }
  .node .lid { stroke: var(--cat); stroke-width: 1.5; }
  .node.selected .body { stroke-width: 3.5; fill-opacity: .22; }
  .node text { fill: var(--text-primary); font-size: 13px; font-weight: 600; pointer-events: none; }
  .node text.sub { fill: var(--text-secondary); font-size: 11px; font-weight: 400; }
  .node .badge rect { fill: var(--surface-1); stroke: var(--cat); stroke-width: 1; }
  .node .badge text { font-size: 10px; font-weight: 500; fill: var(--text-secondary); }
  .node .hatch { fill: url(#hatch); pointer-events: none; }
  .step-badge circle { fill: var(--text-primary); stroke: var(--surface-1); stroke-width: 2; }
  .step-badge text { fill: var(--surface-1); font-size: 11px; font-weight: 700; text-anchor: middle; }
  .hint { font-size: 12px; color: var(--text-muted); }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } #canvas { height: 70vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Open Composer 代码地图</h1>
  <div class="chips" id="summary-chips"></div>
  <div class="controls">
    <div id="flow-buttons" class="chips" role="group" aria-label="端到端流程"></div>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="搜索文件或模块，例如 loop.py" aria-label="搜索文件" autocomplete="off">
      <div id="search-results" role="listbox"></div>
    </div>
    <span class="hint">边：</span>
    <label class="toggle"><input type="checkbox" data-kind="import" checked>导入</label>
    <label class="toggle"><input type="checkbox" data-kind="store" checked>存储</label>
    <label class="toggle"><input type="checkbox" data-kind="api" checked>外部服务</label>
    <label class="toggle"><input type="checkbox" data-kind="lib">第三方库</label>
    <label class="toggle" title="隐藏引用次数少于该值的导入边；面板里的依赖列表不受影响">导入边 ≥ <input id="min-weight" type="range" min="1" max="20" value="5" style="width:90px"> <span id="min-weight-value">5</span> 次</label>
    <button id="btn-tables" aria-pressed="false">表格视图</button>
    <button id="btn-theme">深色/浅色</button>
    <button id="btn-reset">重置</button>
  </div>
</header>
<div id="legend"></div>
<main>
  <div id="canvas"><svg id="map" role="img" aria-label="模块依赖地图"></svg></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<section id="tables" aria-label="表格视图"></section>
<div id="tooltip" role="tooltip"></div>
<script id="codemap-data" type="application/json">__CODEMAP_JSON__</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('codemap-data').textContent);
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (sel, root) => (root || document).querySelector(sel);
  const nodes = DATA.nodes;
  const nodeById = new Map(nodes.map(n => [n.id, n]));
  const edges = DATA.edges;
  const edgeById = new Map(edges.map(e => [e.id, e]));
  const flows = DATA.flows;
  const flowById = new Map(flows.map(f => [f.id, f]));
  const KIND_LABEL = { import: '导入依赖', store: '读写存储', api: '外部服务', lib: '第三方库' };
  const state = { selected: null, selectedEdge: null, flow: null, highlightFile: null, minWeight: 5,
    kinds: { import: true, store: true, api: true, lib: false } };

  const root = document.documentElement;
  if (!root.dataset.theme) {
    root.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Number(n || 0).toLocaleString('en-US');
  const el = (tag, attrs, children) => {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
    (children || []).forEach(c => e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return e;
  };
  const label = id => (nodeById.get(id) || { label: id }).label;

  // ------------------------------------------------------------ header
  const s = DATA.summary;
  $('#summary-chips').innerHTML = [
    ['Python 文件', s.python_files], ['Python 行', s.python_loc], ['前端行', s.frontend_loc],
    ['测试函数', s.test_functions], ['首屏节点', s.first_screen_nodes], ['边', s.edges], ['流程', s.flows],
    ['入口不可达 Python 行', s.unreachable_python_loc], ['cron 实际可达 Python 行', s.cron_reachable_python_loc],
  ].map(([k, v]) => `<span class="chip">${esc(k)} <b>${fmt(v)}</b></span>`).join('') +
    `<span class="chip">生成于 <b>${esc(DATA.generated_at)}</b> @ ${esc((DATA.git.head || '').slice(0, 10))}</span>`;

  const flowButtons = $('#flow-buttons');
  flows.forEach(f => {
    const b = document.createElement('button');
    b.textContent = f.id + ' ' + f.title.split('：')[0];
    b.title = f.title;
    b.dataset.flow = f.id;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => setFlow(state.flow === f.id ? null : f.id));
    flowButtons.appendChild(b);
  });

  document.querySelectorAll('.toggle input[data-kind]').forEach(cb => cb.addEventListener('change', () => {
    state.kinds[cb.dataset.kind] = cb.checked; applyState();
  }));
  $('#min-weight').addEventListener('input', ev => { state.minWeight = Number(ev.target.value); $('#min-weight-value').textContent = ev.target.value; applyState(); });
  $('#btn-theme').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
  $('#btn-reset').addEventListener('click', () => { state.selected = null; state.selectedEdge = null; state.flow = null; state.highlightFile = null; applyState(); });
  $('#btn-tables').addEventListener('click', () => {
    const open = !$('#tables').classList.contains('open');
    $('#tables').classList.toggle('open', open);
    document.body.classList.toggle('tables-open', open);
    $('#btn-tables').setAttribute('aria-pressed', String(open));
    if (open && !$('#tables').dataset.built) buildTables();
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { state.selected = null; state.selectedEdge = null; state.flow = null; applyState(); } });

  // ------------------------------------------------------------ legend
  $('#legend').innerHTML = [
    ['product', '产品与运行面'], ['domain', '核心领域'], ['research', '研究面'], ['store', '数据存储（实线框+顶栏）'], ['external', '外部服务与库（虚线框）'],
  ].map(([c, t]) => `<span class="lg"><span class="swatch ${c}"></span>${t}</span>`).join('') +
    `<span class="lg"><svg viewBox="0 0 34 12"><path d="M1 6H33" stroke="currentColor" stroke-width="2"/></svg>导入依赖</span>` +
    `<span class="lg"><svg viewBox="0 0 34 12"><path d="M1 6H33" stroke="currentColor" stroke-width="2" stroke-dasharray="7 5"/></svg>读写存储</span>` +
    `<span class="lg"><svg viewBox="0 0 34 12"><path d="M1 6H33" stroke="currentColor" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/></svg>外部服务</span>` +
    `<span class="lg"><svg viewBox="0 0 34 12"><path d="M1 6H33" stroke="currentColor" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/></svg>第三方库</span>` +
    `<span class="lg"><svg viewBox="0 0 34 12"><rect x="1" y="1" width="32" height="10" fill="url(#hatch-legend)" stroke="currentColor"/></svg>斜纹 = 一次性/可归档</span>` +
    `<span class="lg hint">线宽 ≈ log2(引用次数)。点击节点看作用、上游、依赖、下游影响与测试；点击流程按钮看端到端路径。</span>`;

  // ------------------------------------------------------------ svg
  const svg = $('#map');
  svg.setAttribute('viewBox', `0 0 ${DATA.layout.width} ${DATA.layout.height}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMin meet');
  const defs = el('defs');
  const marker = (id) => {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' });
    m.appendChild(el('path', { d: 'M0,0 L10,5 L0,10 z', class: 'arrow-' + id }));
    return m;
  };
  defs.appendChild(marker('arrow')); defs.appendChild(marker('arrow-active')); defs.appendChild(marker('arrow-flow'));
  const hatch = el('pattern', { id: 'hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
  hatch.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: 'var(--cat-research)', 'stroke-opacity': 0.4, 'stroke-width': 2 }));
  defs.appendChild(hatch);
  const hatchLegend = hatch.cloneNode(true); hatchLegend.setAttribute('id', 'hatch-legend'); defs.appendChild(hatchLegend);
  const style = el('style'); style.textContent = '.arrow-arrow{fill:var(--edge);fill-opacity:.7} .arrow-arrow-active{fill:var(--edge-strong)} .arrow-arrow-flow{fill:var(--text-primary)}';
  defs.appendChild(style);
  svg.appendChild(defs);

  const gCols = el('g', { class: 'columns' });
  DATA.layout.columns.forEach((title, i) => {
    const x = DATA.layout.col_x[i];
    gCols.appendChild(el('text', { x: x + 118, y: 44, class: 'col-title', 'text-anchor': 'middle' }, [title]));
    if (i > 0) gCols.appendChild(el('line', { x1: x - 32, y1: 60, x2: x - 32, y2: DATA.layout.height - 20, class: 'col-line' }));
  });
  svg.appendChild(gCols);
  const gEdges = el('g', { class: 'edges' });
  const gFlow = el('g', { class: 'flow-edges' });
  const gNodes = el('g', { class: 'nodes' });
  svg.appendChild(gEdges); svg.appendChild(gFlow); svg.appendChild(gNodes);

  const anchor = (n, side) => {
    const p = n.pos;
    if (side === 'r') return [p.x + p.w, p.y + p.h / 2];
    if (side === 'l') return [p.x, p.y + p.h / 2];
    if (side === 't') return [p.x + p.w / 2, p.y];
    return [p.x + p.w / 2, p.y + p.h];
  };
  const edgePath = (sn, tn, offset) => {
    const cs = sn.layout.col, ct = tn.layout.col;
    let x1, y1, x2, y2;
    if (ct > cs) { [x1, y1] = anchor(sn, 'r'); [x2, y2] = anchor(tn, 'l'); y1 += offset; y2 += offset;
      const dx = Math.max(40, (x2 - x1) / 2); return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`; }
    if (ct < cs) { [x1, y1] = anchor(sn, 'l'); [x2, y2] = anchor(tn, 'r'); y1 += offset; y2 += offset;
      const dx = Math.max(40, (x1 - x2) / 2); return `M${x1},${y1} C${x1 - dx},${y1} ${x2 + dx},${y2} ${x2},${y2}`; }
    [x1, y1] = anchor(sn, 'r'); [x2, y2] = anchor(tn, 'r'); const bulge = 70 + Math.abs(y2 - y1) / 6;
    return `M${x1},${y1 + offset} C${x1 + bulge},${y1 + offset} ${x2 + bulge},${y2 - offset} ${x2},${y2 - offset}`;
  };
  const edgeEls = new Map();
  edges.forEach(e => {
    const sn = nodeById.get(e.source), tn = nodeById.get(e.target);
    if (!sn || !tn) return;
    const offset = e.source < e.target ? -5 : 5;
    const d = edgePath(sn, tn, offset);
    const width = Math.min(4.5, 1 + Math.log2(Math.max(1, e.weight)));
    const path = el('path', { d, class: 'edge kind-' + e.kind, 'stroke-width': width.toFixed(2), 'data-id': e.id });
    const hit = el('path', { d, class: 'edge-hit', 'data-id': e.id });
    hit.addEventListener('mouseenter', ev => showTip(ev, edgeTip(e)));
    hit.addEventListener('mousemove', moveTip);
    hit.addEventListener('mouseleave', hideTip);
    hit.addEventListener('click', ev => { ev.stopPropagation(); state.selectedEdge = e.id; state.selected = null; applyState(); });
    gEdges.appendChild(path); gEdges.appendChild(hit);
    edgeEls.set(e.id, { path, hit });
  });

  const wrapLabel = text => {
    if (text.length <= 12) return [text];
    let cut = 11; const punct = ['（', '、', '，', ' '];
    for (let i = 4; i <= 13 && i < text.length - 1; i++) if (punct.includes(text[i])) cut = text[i] === '（' ? i : i + 1;
    return [text.slice(0, cut), text.slice(cut)];
  };
  const nodeEls = new Map();
  nodes.forEach(n => {
    const p = n.pos;
    const g = el('g', { class: 'node cat-' + n.category, 'data-id': n.id, tabindex: 0, role: 'button', 'aria-label': `${n.label}：${n.file_count} 文件 ${n.loc} 行` });
    const isStore = n.category === 'store';
    g.appendChild(el('rect', { class: 'body', x: p.x, y: p.y, width: p.w, height: p.h, rx: isStore ? 4 : (n.category === 'external' ? 18 : 10) }));
    if (isStore) g.appendChild(el('line', { class: 'lid', x1: p.x, y1: p.y + 9, x2: p.x + p.w, y2: p.y + 9 }));
    if (n.texture === 'hatch') g.appendChild(el('rect', { class: 'hatch', x: p.x, y: p.y, width: p.w, height: p.h, rx: 10 }));
    const lines = wrapLabel(n.label);
    lines.forEach((t, i) => g.appendChild(el('text', { x: p.x + 12, y: p.y + 24 + i * 17 }, [t])));
    const sub = n.category === 'store' || n.category === 'external'
      ? `${n.upstream.length} 个模块引用`
      : `${n.file_count} 文件 · ${fmt(n.loc)} 行 · ${n.test_count} 测试`;
    g.appendChild(el('text', { class: 'sub', x: p.x + 12, y: p.y + p.h - 11 }, [sub]));
    if (n.last_commit) {
      const badge = el('g', { class: 'badge' });
      const txt = n.last_commit.slice(0, 7);
      badge.appendChild(el('rect', { x: p.x + p.w - 80, y: p.y - 9, width: 74, height: 16, rx: 8 }));
      badge.appendChild(el('text', { x: p.x + p.w - 43, y: p.y + 3, 'text-anchor': 'middle' }, ['最近 ' + txt]));
      g.appendChild(badge);
    }
    const steps = el('g', { class: 'step-badges' });
    g.appendChild(steps);
    g.addEventListener('click', ev => { ev.stopPropagation(); selectNode(n.id); });
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectNode(n.id); } });
    g.addEventListener('mouseenter', ev => showTip(ev, nodeTip(n)));
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', hideTip);
    gNodes.appendChild(g);
    nodeEls.set(n.id, { g, steps });
  });
  svg.addEventListener('click', () => { if (state.selected || state.selectedEdge) { state.selected = null; state.selectedEdge = null; applyState(); } });

  // ------------------------------------------------------------ tooltip
  const tip = $('#tooltip');
  function showTip(ev, html) { tip.innerHTML = html; tip.style.display = 'block'; moveTip(ev); }
  function moveTip(ev) { const x = Math.min(window.innerWidth - 440, ev.clientX + 14); tip.style.left = x + 'px'; tip.style.top = (ev.clientY + 14) + 'px'; }
  function hideTip() { tip.style.display = 'none'; }
  function nodeTip(n) {
    return `<b>${esc(n.label)}</b><br><span class="k">${esc(n.category_label)}</span> · ${n.file_count} 文件 · ${fmt(n.loc)} 行 · ${n.test_count} 测试函数<br>` +
      `<span class="k">上游</span> ${n.upstream.length} · <span class="k">依赖</span> ${n.dependencies.length} · <span class="k">下游影响</span> ${n.impact.length}<br>${esc(n.purpose)}`;
  }
  function edgeTip(e) {
    const ev = e.evidence.slice(0, 4).map(x => `<div><code>${esc(x.file)}${x.line ? ':' + x.line : ''}</code> ${esc(x.statement)}</div>`).join('');
    return `<b>${esc(label(e.source))}</b> → <b>${esc(label(e.target))}</b><br><span class="k">${KIND_LABEL[e.kind]}</span> · 引用 ${e.weight} 次<br>${ev}`;
  }

  // ------------------------------------------------------------ state
  function selectNode(id) { state.selected = id; state.selectedEdge = null; applyState(); }
  function setFlow(id) { state.flow = id; state.selected = null; state.selectedEdge = null; applyState(); }
  window.codemapSelect = selectNode; window.codemapFlow = setFlow;

  function applyState() {
    const sel = state.selected ? nodeById.get(state.selected) : null;
    const flow = state.flow ? flowById.get(state.flow) : null;
    svg.classList.toggle('has-focus', !!(sel || state.selectedEdge));
    svg.classList.toggle('flow-mode', !!flow && !sel && !state.selectedEdge);
    const neighbours = new Set();
    if (sel) { sel.upstream.forEach(u => neighbours.add(u.id)); sel.dependencies.forEach(d => neighbours.add(d.id));
      edges.forEach(e => { if (e.source === sel.id) neighbours.add(e.target); if (e.target === sel.id) neighbours.add(e.source); }); }
    const flowNodes = new Set(flow ? flow.steps.map(st => st.node) : []);
    const selEdge = state.selectedEdge ? edgeById.get(state.selectedEdge) : null;
    edges.forEach(e => {
      const els = edgeEls.get(e.id); if (!els) return;
      const hidden = !state.kinds[e.kind] || (e.kind === 'import' && e.weight < state.minWeight);
      els.path.classList.toggle('hidden', hidden); els.hit.classList.toggle('hidden', hidden);
      const active = sel ? (e.source === sel.id || e.target === sel.id) : (selEdge ? e.id === selEdge.id : false);
      els.path.classList.toggle('active', active);
      if (active && hidden) { els.path.classList.remove('hidden'); els.hit.classList.remove('hidden'); }
    });
    nodes.forEach(n => {
      const els = nodeEls.get(n.id);
      els.g.classList.toggle('selected', !!sel && sel.id === n.id);
      els.g.classList.toggle('active', (!!sel && sel.id === n.id) || (!!selEdge && (selEdge.source === n.id || selEdge.target === n.id)));
      els.g.classList.toggle('neighbor', !!sel && neighbours.has(n.id));
      els.g.classList.toggle('in-flow', flowNodes.has(n.id));
      els.steps.innerHTML = '';
      if (flow && !sel && !selEdge) {
        const idx = flow.steps.filter(st => st.node === n.id).map(st => st.index);
        idx.forEach((k, i) => {
          const b = el('g', { class: 'step-badge' });
          const cx = n.pos.x + 2 + i * 24, cy = n.pos.y + 2;
          b.appendChild(el('circle', { cx, cy, r: 11 }));
          b.appendChild(el('text', { x: cx, y: cy + 4 }, [String(k)]));
          els.steps.appendChild(b);
        });
      }
    });
    gFlow.innerHTML = '';
    if (flow && !sel && !selEdge) {
      for (let i = 0; i + 1 < flow.steps.length; i++) {
        const a = nodeById.get(flow.steps[i].node), b = nodeById.get(flow.steps[i + 1].node);
        if (!a || !b || a.id === b.id) continue;
        gFlow.appendChild(el('path', { class: 'flow-edge', d: edgePath(a, b, (i % 3) * 6 - 6) }));
      }
    }
    flowButtons.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.flow === state.flow)));
    renderPanel(sel, flow, selEdge);
    const hash = sel ? '#node=' + sel.id : (flow ? '#flow=' + flow.id : '');
    if (location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);
  }

  // ------------------------------------------------------------ panel
  const panel = $('#panel');
  const nodeLink = (id, extra) => `<button class="link" data-node="${esc(id)}">${esc(label(id))}</button>${extra ? ` <span class="num">${esc(extra)}</span>` : ''}`;
  function renderPanel(sel, flow, selEdge) {
    if (sel) panel.innerHTML = nodePanel(sel, flow);
    else if (selEdge) panel.innerHTML = edgePanel(selEdge);
    else if (flow) panel.innerHTML = flowPanel(flow);
    else panel.innerHTML = overviewPanel();
    panel.querySelectorAll('[data-node]').forEach(b => b.addEventListener('click', () => selectNode(b.dataset.node)));
    panel.querySelectorAll('[data-flow]').forEach(b => b.addEventListener('click', () => setFlow(b.dataset.flow)));
    panel.querySelectorAll('[data-edge]').forEach(b => b.addEventListener('click', () => { state.selectedEdge = b.dataset.edge; state.selected = null; applyState(); }));
    const hit = panel.querySelector('.file-row.hit'); if (hit) hit.scrollIntoView({ block: 'center' });
  }
  function overviewPanel() {
    const top = nodes.filter(n => n.category !== 'store' && n.category !== 'external').slice().sort((a, b) => b.loc - a.loc);
    return `<h2>怎么读这张图</h2>
      <p>20 个首屏节点是把 ${fmt(s.python_files)} 个 Python 文件和前端源码按职责归并后的父模块；底层文件都在节点面板的"文件"列表里。</p>
      <p>列从左到右是调用方向：入口与运行面 → 领域模型与治理 → 引擎与研究 → 适配层 → 存储与外部。箭头指向被依赖方。</p>
      <h3>端到端流程</h3>
      ${flows.map(f => `<div class="step"><span class="n">${esc(f.id.slice(1))}</span><div><button class="link" data-flow="${esc(f.id)}">${esc(f.title)}</button><div class="d">${esc(f.summary)}</div></div></div>`).join('')}
      <h3>模块规模（按代码行）</h3>
      <ul class="list">${top.map(n => `<li><span class="grow"><span class="swatch ${n.category}"></span>${nodeLink(n.id)}</span><span class="num">${fmt(n.loc)} 行 · ${n.test_count} 测试 · 最近 ${esc(n.last_commit || '-')}</span></li>`).join('')}</ul>
      <h3>入口不可达的代码</h3>
      <p class="muted">从 <code>oc</code> CLI、Dashboard 服务和 scripts/ 出发沿 import 图不可达（只被测试引用或完全无引用）的 Python：${fmt(s.unreachable_python_files)} 个文件、${fmt(s.unreachable_python_loc)} 行。只能经 CLI 命令到达、脚本与 cron 都不用的：${fmt(s.cli_only_python_loc)} 行。每个交易日 cron 实际会加载的：${fmt(s.cron_reachable_python_loc)} 行。各节点面板内有清单。</p>
      <p class="muted">研究包门面 <code>open_composer/research/__init__.py</code> 再导出 ${s.facade_imports} 个模块；${s.facade_loaded_by_files} 个非测试文件导入 research 包下的内容时都会先执行它。</p>`;
  }
  function nodePanel(n, flow) {
    const kv = [
      ['类别', n.category_label], ['文件', `${n.file_count}（Python ${fmt(n.python_loc)} 行 / 合计 ${fmt(n.loc)} 行）`],
      ['测试', `${n.test_files} 个测试文件 · ${n.test_count} 个测试函数`],
      ['最近提交', n.last_commit || '-'], [`${DATA.summary.churn_since} 以来提交触达`, `${n.churn_touches_since} 文件次`],
      ['节点内部导入', `${n.intra_node_imports} 处`],
    ];
    if (n.reach) {
      kv.push(['cron 入口可达', `${fmt(n.reach.cron_loc)} 行`]);
      kv.push(['scripts 入口可达', `${fmt(n.reach.scripts_loc)} 行`]);
      kv.push(['仅经 CLI 可达', `${fmt(n.reach.cli_only_loc)} 行`]);
      kv.push(['任何入口都不可达', `${fmt(n.reach.unreachable_loc)} 行（${n.unreachable_from_entrypoints.files} 个文件）`]);
    }
    const stepsHere = flows.flatMap(f => f.steps.filter(st => st.node === n.id).map(st => ({ f, st })));
    let html = `<h2><span class="swatch ${n.category}"></span>${esc(n.label)}</h2><p>${esc(n.purpose)}</p>
      <dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
    if (n.paths && n.paths.length) html += `<h3>目录 / 文件</h3><ul class="list">${n.paths.map(p => `<li><code>${esc(p)}</code></li>`).join('')}</ul>`;
    if (n.configs && n.configs.length) html += `<h3>相关配置</h3><ul class="list">${n.configs.map(p => `<li><code>${esc(p)}</code></li>`).join('')}</ul>`;
    html += `<h3>上游调用者（谁依赖它）</h3>` + (n.upstream.length ? `<ul class="list">${n.upstream.map(u => `<li><span class="grow">${nodeLink(u.id)}</span><span class="num">${u.weight} 处</span></li>`).join('')}</ul>` : '<p class="muted">无内部调用者（入口或叶子）。</p>');
    html += `<h3>依赖（它调用谁）</h3>` + (n.dependencies.length ? `<ul class="list">${n.dependencies.map(d => `<li><span class="grow">${nodeLink(d.id)}</span><span class="num">${d.weight} 处</span></li>`).join('')}</ul>` : '<p class="muted">不导入其他内部模块。</p>');
    const ex = n.externals || {};
    const exRows = [['store', '读写存储'], ['api', '外部服务'], ['lib', '第三方库']].filter(([k]) => ex[k] && Object.keys(ex[k]).length);
    if (exRows.length) html += `<h3>数据与外部</h3>` + exRows.map(([k, t]) => `<div class="muted" style="margin-top:4px">${t}</div><ul class="list">${Object.entries(ex[k]).slice(0, 14).map(([name, c]) => `<li><span class="grow"><code>${esc(name)}</code></span><span class="num">${c} 文件</span></li>`).join('')}</ul>`).join('');
    html += `<h3>下游影响（沿文件级 import 图传递依赖它的代码）</h3>` + (n.impact.length ? `<ul class="list">${n.impact.map(i => `<li><span class="grow">${nodeLink(i.id)}</span><span class="num">${i.files} 文件 · ${fmt(i.loc)} 行</span></li>`).join('')}</ul>` : '<p class="muted">没有内部模块依赖它。</p>') +
      (n.impact_tests ? `<p class="muted">传递依赖它的测试：${n.impact_tests.files} 个文件 / ${fmt(n.impact_tests.functions)} 个测试函数。改动后至少要跑这些。</p>` : '');
    if (n.pulls_in && n.pulls_in.length) html += `<h3>传递依赖（加载它会带进来的代码）</h3><ul class="list">${n.pulls_in.map(i => `<li><span class="grow">${nodeLink(i.id)}</span><span class="num">${i.files} 文件 · ${fmt(i.loc)} 行</span></li>`).join('')}</ul>`;
    if (stepsHere.length) html += `<h3>参与的流程</h3>${stepsHere.map(({ f, st }) => `<div class="step"><span class="n">${st.index}</span><div><button class="link" data-flow="${esc(f.id)}">${esc(f.id)} ${esc(f.title.split('：')[0])}</button> · <span class="t">${esc(st.title)}</span><div class="d">${esc(st.detail)} <code>${esc(st.evidence.file)}:${st.evidence.line}</code></div></div></div>`).join('')}`;
    if (n.cli) {
      html += `<h3>CLI 命令组（${n.cli.total_commands} 条命令）→ 触达的模块</h3><ul class="list">${n.cli.groups.map(g => `<li><span class="grow"><code>oc ${esc(g.group)}</code> ${Object.keys(g.nodes).map(k => nodeLink(k)).join(' ')}</span><span class="num">${g.commands} 条</span></li>`).join('')}</ul>`;
    }
    if (n.script_roles) {
      html += `<h3>脚本分类</h3><ul class="list">${Object.entries(n.script_roles).map(([k, v]) => `<li><span class="grow">${esc(k)}</span><span class="num">${v} 个</span></li>`).join('')}</ul>`;
      if (n.crontab && n.crontab.length) html += `<h3>本机 crontab（生成时快照）</h3><ul class="list">${n.crontab.map(c => `<li><code>${esc(c)}</code></li>`).join('')}</ul>`;
    }
    if (n.facade) html += `<h3>包门面</h3><p><code>${esc(n.facade.path)}</code> 导入 ${n.facade.imports} 个模块；${n.facade.loaded_by_files} 个非测试文件会触发它。${esc(n.facade.note)}</p>`;
    html += `<h3>相关测试（${n.test_count} 个函数）</h3>` + (n.tests.length ? `<ul class="list">${n.tests.slice(0, 40).map(t => `<li><span class="grow"><code>${esc(t.path)}</code></span><span class="num">${t.test_count}</span></li>`).join('')}${n.tests.length > 40 ? `<li class="muted">… 另 ${n.tests.length - 40} 个测试文件，见表格视图</li>` : ''}</ul>` : '<p class="muted">没有直接导入该模块的测试文件。</p>');
    const ev = edges.filter(e => e.source === n.id && e.kind === 'import').flatMap(e => e.evidence.slice(0, 2).map(x => ({ ...x, to: e.target })));
    html += `<h3>文件（按行数）</h3><ul class="list">${n.files.slice(0, 200).map(f => `<li class="file-row${state.highlightFile === f.path ? ' hit' : ''}"><span class="grow"><code>${esc(f.path)}</code>${f.role ? ` <span class="muted">${esc(f.role)}</span>` : ''}${f.reachable === false ? ' <span class="muted">入口不可达</span>' : (f.entries && f.entries.length === 1 && f.entries[0] === 'cli' ? ' <span class="muted">仅 CLI</span>' : (f.entries && f.entries.includes('cron') ? ' <span class="muted">cron</span>' : ''))}</span><span class="num">${fmt(f.loc)} 行 · 入 ${f.in} 出 ${f.out}${f.last_commit ? ' · ' + esc(f.last_commit.slice(0, 7)) : ''}</span></li>`).join('')}${n.files.length > 200 ? `<li class="muted">… 另 ${n.files.length - 200} 个文件</li>` : ''}</ul>`;
    if (ev.length) html += `<h3>依赖证据（源码位置）</h3><ul class="list">${ev.slice(0, 16).map(x => `<li><span class="grow"><code>${esc(x.file)}:${x.line}</code> → ${nodeLink(x.to)}<div class="muted">${esc(x.statement)}</div></span></li>`).join('')}</ul>`;
    return html;
  }
  function edgePanel(e) {
    return `<h2>${esc(label(e.source))} → ${esc(label(e.target))}</h2><p>${KIND_LABEL[e.kind]} · 引用 ${e.weight} 次。</p>
      <h3>证据</h3><ul class="list">${e.evidence.map(x => `<li><span class="grow"><code>${esc(x.file)}${x.line ? ':' + x.line : ''}</code><div class="muted">${esc(x.statement)}${x.target ? ' → ' + esc(x.target) : ''}</div></span></li>`).join('')}</ul>
      <p class="muted">${e.kind === 'import' ? '导入证据按文件去重后最多列 8 条。' : '按路径/服务/库名去重后列出。'}</p>`;
  }
  function flowPanel(f) {
    return `<h2>${esc(f.id)} ${esc(f.title)}</h2><p>${esc(f.summary)}</p>
      ${f.steps.map(st => `<div class="step"><span class="n">${st.index}</span><div><span class="t">${esc(st.title)}</span> · ${nodeLink(st.node)}<div class="d">${esc(st.detail)}</div><code>${esc(st.evidence.file)}:${st.evidence.line}</code> <span class="muted">${esc(st.evidence.expect)}</span></div></div>`).join('')}
      <p class="hint">节点上的数字是该流程的步骤序号；粗线是步骤间的走向。</p>`;
  }

  // ------------------------------------------------------------ search
  const allFiles = [];
  nodes.forEach(n => { n.files.forEach(f => allFiles.push({ path: f.path, node: n.id, kind: '源码', loc: f.loc })); n.tests.forEach(t => allFiles.push({ path: t.path, node: n.id, kind: '测试', loc: t.test_count })); });
  const searchInput = $('#search'), results = $('#search-results');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (q.length < 2) { results.classList.remove('open'); return; }
    const hits = [];
    nodes.forEach(n => { if (n.label.toLowerCase().includes(q) || n.id.includes(q)) hits.push({ path: n.label, node: n.id, kind: '模块' }); });
    allFiles.forEach(f => { if (f.path.toLowerCase().includes(q)) hits.push(f); });
    results.innerHTML = hits.slice(0, 30).map(h => `<button type="button" data-node="${esc(h.node)}" data-path="${esc(h.path)}">${esc(h.path)}<small>${esc(h.kind)} · ${esc(label(h.node))}</small></button>`).join('') || '<button type="button" disabled>没有匹配</button>';
    results.classList.add('open');
    results.querySelectorAll('button[data-node]').forEach(b => b.addEventListener('click', () => {
      state.highlightFile = b.dataset.path; results.classList.remove('open'); selectNode(b.dataset.node);
    }));
  });
  document.addEventListener('click', ev => { if (!ev.target.closest('#search-wrap')) results.classList.remove('open'); });

  // ------------------------------------------------------------ tables
  function buildTables() {
    const t = $('#tables');
    t.dataset.built = '1';
    t.innerHTML = `<h2>节点</h2><table><thead><tr><th>节点</th><th>类别</th><th class="num">文件</th><th class="num">行</th><th class="num">测试函数</th><th class="num">上游</th><th class="num">依赖</th><th class="num">下游影响模块</th><th class="num">传递依赖的测试</th><th>最近提交</th><th class="num">${esc(s.churn_since)} 以来触达</th><th class="num">仅 CLI 可达行</th><th class="num">cron 可达行</th><th class="num">入口不可达行</th></tr></thead><tbody>
      ${nodes.map(n => `<tr><td>${esc(n.label)}</td><td>${esc(n.category_label)}</td><td class="num">${n.file_count}</td><td class="num">${fmt(n.loc)}</td><td class="num">${n.test_count}</td><td class="num">${n.upstream.length}</td><td class="num">${n.dependencies.length}</td><td class="num">${n.impact.length}</td><td class="num">${n.impact_tests ? n.impact_tests.functions : 0}</td><td>${esc(n.last_commit || '-')}</td><td class="num">${n.churn_touches_since}</td><td class="num">${fmt(n.reach ? n.reach.cli_only_loc : 0)}</td><td class="num">${fmt(n.reach ? n.reach.cron_loc : 0)}</td><td class="num">${fmt(n.unreachable_from_entrypoints ? n.unreachable_from_entrypoints.loc : 0)}</td></tr>`).join('')}</tbody></table>
      <h2>边</h2><table><thead><tr><th>来源</th><th>目标</th><th>类型</th><th class="num">引用次数</th><th>首条证据</th></tr></thead><tbody>
      ${edges.slice().sort((a, b) => b.weight - a.weight).map(e => `<tr><td>${esc(label(e.source))}</td><td>${esc(label(e.target))}</td><td>${KIND_LABEL[e.kind]}</td><td class="num">${e.weight}</td><td><code>${esc(e.evidence[0] ? e.evidence[0].file + (e.evidence[0].line ? ':' + e.evidence[0].line : '') : '')}</code></td></tr>`).join('')}</tbody></table>
      <h2>流程步骤</h2><table><thead><tr><th>流程</th><th class="num">步</th><th>节点</th><th>步骤</th><th>证据</th></tr></thead><tbody>
      ${flows.flatMap(f => f.steps.map(st => `<tr><td>${esc(f.id)}</td><td class="num">${st.index}</td><td>${esc(label(st.node))}</td><td>${esc(st.title)}</td><td><code>${esc(st.evidence.file)}:${st.evidence.line}</code></td></tr>`)).join('')}</tbody></table>`;
  }

  // ------------------------------------------------------------ init
  const m = location.hash.match(/^#(node|flow)=([\w-]+)$/);
  if (m && m[1] === 'node' && nodeById.has(m[2])) state.selected = m[2];
  if (m && m[1] === 'flow' && flowById.has(m[2])) state.flow = m[2];
  applyState();
})();
</script>
</body>
</html>

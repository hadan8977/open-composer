  - id: events.sec_form4_insider
    kind: event
    status: trial
    provider: sec
    use_for: [insider_confirmation_gate, cross_sectional_feature]
    reliability: high
    default_mode: live_with_cache
    strict_behavior: research_only
    fixture: data/fixtures/capabilities/sec_form4_insider.jsonl
    env: [SEC_USER_AGENT]
    min_score: 0.9
    source_urls:
      quarterly_data_sets: https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{yyyy}q{n}_form345.zip
      daily_index: https://www.sec.gov/Archives/edgar/daily-index/{yyyy}/QTR{n}/form.{yyyymmdd}.idx
    collector: scripts/collect_sec_insider_transactions.py
    feature_builder: scripts/build_insider_features.py
    caveats:
      - visible date = FILING_DATE next US trading session; TRANS_DATE is never used as visibility
      - 10b5-1 plan trades cannot always be distinguished; flag field if present (SUBMISSION.AFF10B5ONE exists only from 2023q2 onward, so every earlier filing's is_10b5_1 is null, never false)
      - SEC data reuse is public domain but personal names are not to be redistributed
      - quarterly data sets are bucketed by FILING_DATE and publish roughly one week after quarter end, so the most recent weeks are only available through the EDGAR daily index tail collector
      - a single Form 4 can be filed jointly by several reporting owners, so share and dollar sums must use owner_seq == 0 rows while owner counts use every row
      - ISSUERTRADINGSYMBOL is issuer-supplied free text and is not a permanent security identifier; issuer_cik is kept for later PIT symbol mapping
      - late and back-dated filings are normal (2016q1 contains transactions dated 2005) and a few TRANS_DATE values are impossible (future-dated), so transaction dates must be clipped against the filing date
      - "research_only: sample and fixture rows are not paper-ready market evidence"

  - id: events.sec_13d_13g
    kind: event
    status: trial
    provider: sec
    use_for: [activist_event_drift, cross_sectional_feature, llm_dossier_material]
    reliability: high
    default_mode: live_with_cache
    strict_behavior: research_only
    fixture: data/fixtures/capabilities/sec_13d_13g.jsonl
    env: [SEC_USER_AGENT]
    min_score: 0.9
    source_urls:
      quarterly_form_index: https://www.sec.gov/Archives/edgar/full-index/{yyyy}/QTR{n}/form.idx
      complete_submission: https://www.sec.gov/Archives/{file_name}
      company_tickers: https://www.sec.gov/files/company_tickers.json
    collector: scripts/collect_sec_13d_filings.py
    feature_builder: scripts/build_sec_13d_features.py
    caveats:
      - visibility = the <ACCEPTANCE-DATETIME> in the filing header; a filing accepted after that session's close is visible only on the next session, and the card's entry is the session after visibility
      - Schedule 13D/G same-day filing-date cutoff was 17:30 ET before 2024-02-05 and is 22:00 ET from that date under FR2023-22678 II.A.5; this is not a dissemination-latency timestamp
      - the legacy close-based acceptance-to-session mapping is retained; acceptance, public availability, retrieval and computation clocks are distinct, and received archive/header bytes do not certify historical first-seen PIT or activist novelty
      - Date Filed in the quarterly index has no time of day and cannot separate a 09:45 ET filing from a 16:40 ET one; it is used only for the 13G family, which is not document-fetched and is flagged visible_confidence=filing_date_only
      - EDGAR renamed the form types on 2024-12-18 (SC 13D -> SCHEDULE 13D); both spellings are normalized and form_type_raw keeps the original, otherwise every 2025+ amendment parses as a new filing
      - the filer of a Schedule 13D is the activist, not the issuer; the issuer must come from the header SUBJECT COMPANY block, never from the first CIK in the file
      - percent of class is parsed from the cover page for pre-2024-12 text filings and carries percent_parse_confidence (high/medium/none); structured XML filings (2024-12-18 onward) supply it directly
      - Item 4 character count is a crude activism proxy only; it does not distinguish a genuine campaign from a verbose boilerplate purpose statement
      - company_tickers.json is a current snapshot, so issuers acquired or delisted before it was fetched have no ticker row and their filings cannot be mapped; the PIT ADV universe is itself built from surviving symbols, so activist targets that were taken over are systematically absent
      - the 13G family is ~95% of Schedule 13 traffic (28,924 SC 13G/A in 2024Q1 alone) and is index-only in this build; do not read 13G rows as having a verified visibility timestamp
      - "measured on a 400-filing random 13G/13G/A header sample (2026-09-17): index-only issuer attribution disagrees with the filing header's SUBJECT COMPANY for 14.0% of comparable filings (46/328) and a further 8.9% have no in-force ticker at all, so 13G counts must be quoted at the EDGAR index level, not per issuer"
      - "research_only: sample and fixture rows are not paper-ready market evidence"

  - id: market.finra_short_interest
    kind: event
    status: trial
    provider: finra
    use_for: [short_interest_avoid_list, cross_sectional_feature, llm_dossier_material]
    reliability: high
    default_mode: live_with_cache
    strict_behavior: research_only
    fixture: data/fixtures/capabilities/finra_short_interest.jsonl
    env: []
    min_score: 0.9
    source_urls:
      query_api_data: https://api.finra.org/data/group/otcMarket/name/consolidatedShortInterest
      query_api_partitions: https://api.finra.org/partitions/group/otcMarket/name/consolidatedShortInterest
      query_api_metadata: https://api.finra.org/metadata/group/otcMarket/name/consolidatedShortInterest
      official_publication_schedule: https://www.finra.org/filing-reporting/regulatory-filing-systems/short-interest
    collector: scripts/collect_finra_short_interest.py
    feature_builder: scripts/build_short_interest_features.py
    caveats:
      - "FINRA states non-commercial use of FINRA Data; this repo's use is personal research only and the data must not be redistributed or resold"
      - kind is event rather than market because the payload is a bi-monthly position snapshot with an explicit publication timestamp, not an OHLCV series; the market-kind evaluator expects OHLCV columns
      - visible date = next US equity session after the official publication date; settlementDate is NEVER a visibility date (it precedes publication by 7 sessions, so keying on it is a week-and-a-half look-ahead)
      - "publication dates come from FINRA's own settlement/due/publication table where the live page carries them (2025-11-14 onward, 28 rows as of 2026-09-17) and otherwise from the rule that table validates exactly: settlement + 7 US equity sessions, which matches FINRA's prose of roughly eight business days once the publication session itself is excluded"
      - "the publication time of day is not documented anywhere on the FINRA page, so the whole publication session is treated as unusable rather than assuming a morning release"
      - "historical depth measured, not assumed: the partitions endpoint lists 209 settlement dates from 2017-12-29 to 2026-08-31, so 2016-01-01..2017-12-28 is NOT available; cdn.finra.org/equity/otcshortinterest returns HTTP 403 and the otce.finra.org static-archive page is a JavaScript shell, so there is no free back-fill and every downstream table starts in 2018"
      - "the dataset's own metadata description still says data is available online for one rolling year; that is stale, but it means the depth above is not contractual and could be withdrawn"
      - "consolidatedShortInterest (all exchanges, used here) and equityShortInterest (OTC-only, different fields) are different datasets and must not be concatenated"
      - "daily short sale volume (regShoDaily) is deliberately NOT collected: FINRA states it is volume marked short on the day, not a net position, and it is dominated by market-maker hedging, so it cannot be read as bearish sentiment"
      - daysToCoverQuantity documents 0 as its default value rather than a measurement, so a record with no positive averageDailyVolume must carry a null days-to-cover downstream, never 0
      - FINRA's averageDailyVolumeQuantity excludes non-media trades and is not the same denominator as our own dollar_adv_63/close, so days_to_cover and short_interest_ratio are two different normalizations of the same numerator
      - no shares-outstanding or float series exists in this repo, so short interest as a percentage of float cannot be computed and the ADV-based ratio must not be read as one
      - "revisionFlag='R' marks a revision of the PRIOR cycle; snapshots are kept exactly as published and revisions are never back-applied, because back-applying them would break point-in-time"
      - symbolCode is a SIP symbol at publication time and is not a permanent security identifier; ticker changes and reuses are not tracked
      - "research_only: sample and fixture rows are not paper-ready market evidence"


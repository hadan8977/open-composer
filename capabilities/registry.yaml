version: 1
capabilities:
  - id: market.sample_ohlcv
    kind: market
    status: approved
    provider: local
    use_for: [backtest, scan, fixture]
    reliability: high
    default_mode: offline
    supported_timeframes: [5m, 15m, 1h, daily, weekly]
    paper_ready_timeframes: []
    strict_behavior: workflow_only
    fixture: data/sample/qqq_15m.csv
    min_score: 0.95
    caveats:
      - sample data is deterministic and not representative of live market coverage

  - id: market.alpaca_bars
    kind: market
    status: approved
    provider: alpaca
    use_for: [ohlcv, scan, backtest, paper_context]
    reliability: medium
    default_mode: live_with_cache
    supported_timeframes: [1m, 5m, 15m, 30m, 1h, 4h, daily, weekly]
    paper_ready_timeframes: [1m, 5m, 15m, 30m, 1h, 4h, daily, weekly]
    strict_behavior: fail_fast_for_unsupported_timeframes
    fixture: data/fixtures/capabilities/alpaca_qqq_15m.csv
    env: [ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY, ALPACA_DATA_FEED]
    min_score: 0.85
    caveats:
      - free IEX feed is not consolidated full-market SIP data

  - id: market.longbridge_bars
    kind: market
    status: trial
    provider: longbridge
    use_for: [ohlcv, scan, backtest, paper_context]
    reliability: medium
    default_mode: live_with_cache
    supported_timeframes: [1m, 5m, 15m, 1h, daily, weekly]
    paper_ready_timeframes: [1m, 5m, 15m, 1h, daily, weekly]
    strict_behavior: fail_fast_for_unsupported_timeframes
    fixture: data/fixtures/capabilities/longbridge_qqq_15m.csv
    env: [LONGBRIDGE_APP_KEY, LONGBRIDGE_APP_SECRET, LONGBRIDGE_ACCESS_TOKEN]
    min_score: 0.85
    caveats:
      - free US market data is based on Nasdaq Basic, not consolidated SIP data
      - historical candlestick requests are limited to 1000 bars per request
      - minute history range and quote card permissions must be verified against the account

  - id: market.cboe_volatility_indices
    kind: market
    status: trial
    provider: cboe_global_indices
    use_for: [volatility_term_structure, regime_filter, backtest]
    reliability: high
    default_mode: live_with_cache
    supported_timeframes: [daily]
    paper_ready_timeframes: []
    strict_behavior: research_only
    data_shape: paired_eod_index_v1
    fixture: data/fixtures/capabilities/cboe_vix_term_structure_daily.csv
    min_score: 0.95
    source_urls:
      VIX: https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv
      VIX3M: https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX3M_History.csv
    caveats:
      - the fixture validates daily index shape only and is not market or research evidence
      - historical fetched_at is the actual snapshot retrieval time and is not a historical first-seen timestamp
      - completed index observations are conservatively visible only at the next US equity regular open
      - VIX and VIX3M are non-tradable index levels and cannot be submitted as broker order symbols
      - paper readiness requires live collection latency, immutable snapshot, and fail-closed missing-row verification

  - id: market.memory_storage_sample
    kind: market
    status: approved
    provider: local
    use_for: [scenario_test, intraday_backtest, optimization]
    reliability: high
    default_mode: offline
    supported_timeframes: [15m]
    paper_ready_timeframes: []
    strict_behavior: workflow_only
    fixture: data/sample/mu_15m.csv
    min_score: 0.95
    caveats:
      - deterministic scenario fixture for product verification, not live market evidence

  - id: market.synthetic_daily_long
    kind: market
    status: approved
    provider: local
    use_for: [backtest_audit, regression_test, long_window_smoke]
    reliability: high
    default_mode: offline
    supported_timeframes: [daily]
    paper_ready_timeframes: []
    strict_behavior: workflow_only
    fixture: data/sample/syn_daily.csv
    min_score: 0.95
    caveats:
      - 1000-bar synthetic GBM (mu=10%, sigma=18%) with one injected 25% crash window
      - deterministic reproducible fixture (seed=42); not a real market series

  - id: events.sec_filings
    kind: event
    status: approved
    provider: sec
    use_for: [company_events, risk_filter, weekly_review]
    reliability: high
    default_mode: live_with_cache
    fixture: data/fixtures/capabilities/sec_filings.jsonl
    env: [SEC_USER_AGENT]
    min_score: 0.9
    caveats:
      - filings are official but not equivalent to broad news coverage
      - acceptanceDateTime is used when present; filings without it are visible only from collector fetch time
      - filingDate is a calendar date, not a release timestamp, and is never converted to a synthetic intraday time
      - live SEC requests require SEC_USER_AGENT with a contact email
      - EDGAR public access does not establish reuse rights for issuer-authored filing content

  - id: events.sec_form4_insider
    kind: event
    status: trial
    provider: sec
    use_for: [insider_confirmation_gate, cross_sectional_feature]
    reliability: high
    default_mode: live_with_cache
    strict_behavior: research_only
    fixture: data/fixtures/capabilities/sec_form4_insider.jsonl
    env: [SEC_USER_AGENT]
    min_score: 0.9
    source_urls:
      quarterly_data_sets: https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{yyyy}q{n}_form345.zip
      daily_index: https://www.sec.gov/Archives/edgar/daily-index/{yyyy}/QTR{n}/form.{yyyymmdd}.idx
    collector: scripts/collect_sec_insider_transactions.py
    feature_builder: scripts/build_insider_features.py
    caveats:
      - visible date = FILING_DATE next US trading session; TRANS_DATE is never used as visibility
      - 10b5-1 plan trades cannot always be distinguished; flag field if present (SUBMISSION.AFF10B5ONE exists only from 2023q2 onward, so every earlier filing's is_10b5_1 is null, never false)
      - SEC data reuse is public domain but personal names are not to be redistributed
      - quarterly data sets are bucketed by FILING_DATE and publish roughly one week after quarter end, so the most recent weeks are only available through the EDGAR daily index tail collector
      - a single Form 4 can be filed jointly by several reporting owners, so share and dollar sums must use owner_seq == 0 rows while owner counts use every row
      - ISSUERTRADINGSYMBOL is issuer-supplied free text and is not a permanent security identifier; issuer_cik is kept for later PIT symbol mapping
      - late and back-dated filings are normal (2016q1 contains transactions dated 2005) and a few TRANS_DATE values are impossible (future-dated), so transaction dates must be clipped against the filing date
      - "research_only: sample and fixture rows are not paper-ready market evidence"

  - id: events.sec_13d_13g
    kind: event
    status: trial
    provider: sec
    use_for: [activist_event_drift, cross_sectional_feature, llm_dossier_material]
    reliability: high
    default_mode: live_with_cache
    strict_behavior: research_only
    fixture: data/fixtures/capabilities/sec_13d_13g.jsonl
    env: [SEC_USER_AGENT]
    min_score: 0.9
    source_urls:
      quarterly_form_index: https://www.sec.gov/Archives/edgar/full-index/{yyyy}/QTR{n}/form.idx
      complete_submission: https://www.sec.gov/Archives/{file_name}
      company_tickers: https://www.sec.gov/files/company_tickers.json
    collector: scripts/collect_sec_13d_filings.py
    feature_builder: scripts/build_sec_13d_features.py
    caveats:
      - visibility = the <ACCEPTANCE-DATETIME> in the filing header; a filing accepted after that session's close is visible only on the next session, and the card's entry is the session after visibility
      - EDGAR disseminates filings accepted by 17:30 ET on the same business day, which is after every market close, so the close-based visibility rule here is never more aggressive than EDGAR's own cutoff
      - Date Filed in the quarterly index has no time of day and cannot separate a 09:45 ET filing from a 16:40 ET one; it is used only for the 13G family, which is not document-fetched and is flagged visible_confidence=filing_date_only
      - EDGAR renamed the form types on 2024-12-18 (SC 13D -> SCHEDULE 13D); both spellings are normalized and form_type_raw keeps the original, otherwise every 2025+ amendment parses as a new filing
      - the filer of a Schedule 13D is the activist, not the issuer; the issuer must come from the header SUBJECT COMPANY block, never from the first CIK in the file
      - percent of class is parsed from the cover page for pre-2024-12 text filings and carries percent_parse_confidence (high/medium/none); structured XML filings (2024-12-18 onward) supply it directly
      - Item 4 character count is a crude activism proxy only; it does not distinguish a genuine campaign from a verbose boilerplate purpose statement
      - company_tickers.json is a current snapshot, so issuers acquired or delisted before it was fetched have no ticker row and their filings cannot be mapped; the PIT ADV universe is itself built from surviving symbols, so activist targets that were taken over are systematically absent
      - the 13G family is ~95% of Schedule 13 traffic (28,924 SC 13G/A in 2024Q1 alone) and is index-only in this build; do not read 13G rows as having a verified visibility timestamp
      - "measured on a 400-filing random 13G/13G/A header sample (2026-09-17): index-only issuer attribution disagrees with the filing header's SUBJECT COMPANY for 14.0% of comparable filings (46/328) and a further 8.9% have no in-force ticker at all, so 13G counts must be quoted at the EDGAR index level, not per issuer"
      - "research_only: sample and fixture rows are not paper-ready market evidence"

  - id: macro.fred_series
    kind: macro
    status: trial
    provider: fred
    use_for: [macro_filter, weekly_review]
    reliability: high
    default_mode: live_with_cache
    strict_behavior: research_only
    fixture: data/fixtures/capabilities/fred_macro.jsonl
    env: [FRED_API_KEY]
    min_score: 0.9
    caveats:
      - macro series are structured releases, not real-time breaking news
      - observation dates are periods, not release timestamps; live records are forward-only from collector fetch time
      - the current observations endpoint is a latest snapshot, is revision-prone, and supplies no historical vintage identity
      - use and redistribution rights can vary by underlying FRED series and must be checked separately

  - id: macro.cftc_cot
    kind: macro
    status: trial
    provider: cftc
    use_for: [institutional_positioning, regime_filter, weekly_research]
    reliability: high
    default_mode: live_with_cache
    strict_behavior: research_only
    supported_timeframes: [daily, weekly]
    paper_ready_timeframes: []
    fixture: data/fixtures/capabilities/cftc_cot.jsonl
    min_score: 0.9
    caveats:
      - the fixture validates packet shape only and is not market or research evidence
      - COT reports are weekly aggregate positions, not futures prices, carry, or direct trade recommendations
      - reports before 2022-09-13 use a conservative 14-day visibility lag because PRE migration timestamps do not prove original publication time
      - the 2018-2019 federal shutdown backlog is excluded instead of assigning inferred publication dates
      - native PRE rows use official created_at and updated_at system timestamps, including delayed publications
      - paper readiness requires an immutable official snapshot, marginal-lift and placebo evidence, and fail-closed missing-packet behavior

  - id: news.alpha_vantage
    kind: news
    status: trial
    provider: alpha_vantage
    use_for: [watchlist_news, sentiment, signal_review]
    reliability: unknown
    default_mode: live_with_cache
    fixture: data/fixtures/capabilities/alpha_vantage_news.jsonl
    env: [ALPHA_VANTAGE_API_KEY]
    min_score: 0.75
    caveats:
      - free tier coverage and limits must be measured against the user's watchlist
      - provider publication time does not prove collector availability; absent explicit first-seen metadata, visibility begins at fetch time
      - historical news backfills without captured first-seen timestamps are not point-in-time replay evidence
      - provider and original-source terms govern news-content use and redistribution

  - id: news.gdelt
    kind: news
    status: trial
    provider: gdelt
    use_for: [broad_event_detection, macro_event_monitoring]
    reliability: noisy
    default_mode: live_with_cache
    fixture: data/fixtures/capabilities/gdelt_news.jsonl
    min_score: 0.7
    caveats:
      - broad coverage creates noise; use strict filters and dedupe
      - historical provider timestamps do not prove collector availability; live records default to fetch-time visibility
      - GDELT metadata access does not convey reuse rights for linked article content

  - id: news.alpaca
    kind: news
    status: trial
    provider: alpaca
    use_for: [forward_theme_detection, structured_llm_factor, signal_review]
    reliability: medium
    default_mode: live_with_cache
    strict_behavior: forward_only_fail_closed
    fixture: data/fixtures/capabilities/alpaca_news.jsonl
    env: [ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY]
    min_score: 0.9
    caveats:
      - the fixture validates packet shape only and is not market or research evidence
      - historical provider timestamps do not prove local first-seen time; strategy visibility begins no earlier than collector fetch time
      - historical downloads before the R11 collector epoch cannot support historical or forward LLM alpha
      - provider and original-publisher terms govern content use and redistribution
      - paper readiness requires measured live coverage, deduplication, revision handling, and fail-closed missing-packet behavior

  - id: options.trial_chain
    kind: options_chain
    status: trial
    provider: unconfigured
    use_for: [options_research, observation]
    reliability: unknown
    default_mode: live_with_cache
    supported_timeframes: [daily]
    paper_ready_timeframes: []
    strict_behavior: research_only
    fixture: data/fixtures/capabilities/options_chain_sample.jsonl
    min_score: 0.7
    caveats:
      - options chains are research-only until provider coverage, greeks, spreads, and broker rules are verified
      - options strategies do not enter automatic paper order flow in this MVP

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-composer"
version = "0.1.0"
description = "Repo-native AI strategy workbench for LLM-assisted quantitative trading research."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "alpaca-py>=0.28.0",
  "httpx>=0.27",
  "lightgbm>=4.5",
  "longbridge>=4.0.6",
  "nautilus-trader==1.219.0",
  "numpy>=1.26",
  "openai>=1.90.0",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyjwt[crypto]>=2.8",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.scripts]
oc = "open_composer.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["open_composer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
